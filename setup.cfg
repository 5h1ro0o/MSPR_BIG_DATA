[flake8]
max-line-length = 100
extend-ignore =
    E203,
    E501,
    W503,
    E402,
    E221,
    E231,
    E261,
    E272,
    E127
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    ml/artifacts,
    frontend,
    logs,
    *.egg-info

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[isort]
profile = black
line_length = 100
skip = ml/artifacts,frontend,logs,.venv,venv

[coverage:run]
source =
    etl
    config
omit =
    tests/*
    etl/extract/datagouv.py
    */__pycache__/*

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 10
