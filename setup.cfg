[flake8]
max-line-length = 100
extend-ignore =
    E203,
    E501,
    W503,
    E402
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    ml/artifacts,
    frontend,
    logs,
    *.egg-info

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[isort]
profile = black
line_length = 100
skip = ml/artifacts,frontend,logs,.venv,venv

[coverage:run]
source =
    etl
    ml
    config
    orchestration
    monitoring
omit =
    tests/*
    ml/artifacts/*
    */__pycache__/*

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 50
