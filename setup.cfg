[flake8]
max-line-length = 100
extend-ignore =
    E203,
    E501,
    W503,
    E402,
    E221,
    E231,
    E261,
    E272,
    E127
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    ml/artifacts,
    frontend,
    logs,
    audit,
    *.egg-info

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[isort]
profile = black
line_length = 100
skip = ml/artifacts,frontend,logs,.venv,venv,audit

[coverage:run]
source =
    etl
    config
    monitoring
    ml
omit =
    tests/*
    etl/extract/datagouv.py
    etl/extract/securite.py
    etl/extract/associations.py
    etl/extract/entreprises.py
    etl/extract/elections.py
    etl/extract/candidats.py
    etl/extract/demographique.py
    etl/extract/pauvrete.py
    etl/extract/chomage.py
    etl/quality/ge_suite.py
    ml/models/random_forest.py
    ml/models/gradient_boosting.py
    ml/models/decision_tree.py
    ml/models/mlp.py
    ml/models/lstm.py
    ml/training/trainer.py
    ml/training/db_store.py
    ml/prediction/predictor.py
    ml/projection/generate_projections.py
    ml/preprocessing.py
    ml/config.py
    */__pycache__/*

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 80
