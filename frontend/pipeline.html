<script type="text/babel">
function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">

        <span className="chip">run_id · 20260507T121254_2e4940</span>
      </div>
      <h1 className="headline-1">Du fichier brut au dataset ML — 14 étapes.</h1>
      <p className="dek">
        Architecture Medallion bronze / silver / gold. Fetch automatique depuis data.gouv.fr,
        transformation par couche, 14 quality gates, chargement PostgreSQL.
        Durée totale réelle : 1 min 33 s · 1 268 communes · 113 colonnes.
      </p>
    </section>
  );
}

function KPIs() {
  const kpis = [
    { lbl: 'Communes gold',    val: '1 268', unit: '',    note: '8 depts IDF' },
    { lbl: 'Colonnes features', val: '113',  unit: '',    note: '0 nulls' },
    { lbl: 'Quality gates',    val: '14/14', unit: '',    note: 'Tous passés' },
    { lbl: 'Durée ETL',        val: '93',    unit: 's',   note: 'Dont 78s candidats' },
  ];
  return (
    <div className="kpi-row" style={{ marginBottom: 48 }}>
      {kpis.map(k => (
        <div key={k.lbl} className="kpi">
          <div className="kpi-hd"><span className="label">{k.lbl}</span></div>
          <div className="kpi-value tnum">
            {k.val}<span className="unit">{k.unit}</span>
          </div>
          <div className="kpi-foot"><span style={{ color: 'var(--status-ok)' }}>{k.note}</span></div>

      ))}

}

function Steps() {
  const maxDur = Math.max(...MOCK.steps.map(s => s.dur));
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Chronologie</span>
          <h2>14 étapes — durées réelles (run 07/05/2026)</h2>
        </div>
        <span className="chip">Total ETL : 93,1 s</span>
      </div>
      <div className="panel">
        {MOCK.steps.map((s, i) => (
          <div key={s.name} style={{
            display: 'grid', gridTemplateColumns: '180px 1fr 60px',
            alignItems: 'center', gap: 12,
            padding: '8px 0',
            borderBottom: i < MOCK.steps.length - 1 ? '1px solid var(--line-soft)' : 'none',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-5)', minWidth: 24 }}>
                {String(i + 1).padStart(2, '0')}
              </span>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink)' }}>{s.name}</span>
            </div>
            <div style={{ height: 6, background: 'var(--bg-3)', borderRadius: 3, overflow: 'hidden' }}>
              <div style={{
                height: '100%',
                width: Math.max(0.5, (s.dur / maxDur) * 100) + '%',
                background: s.dur > 10 ? 'var(--d-2)' : s.dur > 2 ? 'var(--d-3)' : 'var(--status-ok)',
                borderRadius: 3,
              }} />
            </div>
            <div style={{ textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 11,
              color: s.dur > 10 ? 'var(--d-2)' : 'var(--ink-4)' }}>
              {s.dur.toFixed(1)}s
            </div>
          </div>
        ))}
        <div style={{ marginTop: 12, padding: '10px 0', borderTop: '1px solid var(--line)', fontSize: 12, color: 'var(--ink-4)' }}>
          L'étape <span style={{ fontFamily: 'var(--mono)', color: 'var(--d-2)' }}>extract_candidats</span> (78,5 s)
          traite 27 276 541 lignes en deux passes (historique + 2022) par chunks de 200 000 lignes.
        </div>
      </div>
    </section>
  );
}

// ── Diagramme de flux BPM (Étape 3) ──────────────────────────────────────────
function BPMDiagram() {
  const nodes = [
    // Sources
    { id:'src1', x:30,  y:50,  w:120, h:36, label:'data.gouv.fr API', type:'source' },
    { id:'src2', x:30,  y:100, w:120, h:36, label:'INSEE (CSV/Excel)', type:'source' },
    { id:'src3', x:30,  y:150, w:120, h:36, label:'Filosofi 2017',     type:'source' },
    { id:'src4', x:30,  y:200, w:120, h:36, label:'Sirene / RNA',      type:'source', optional:true },
    // Bronze
    { id:'br1',  x:200, y:50,  w:130, h:36, label:'Elections raw',     type:'bronze' },
    { id:'br2',  x:200, y:100, w:130, h:36, label:'Démographie raw',   type:'bronze' },
    { id:'br3',  x:200, y:150, w:130, h:36, label:'Pauvreté raw',      type:'bronze' },
    { id:'br4',  x:200, y:200, w:130, h:36, label:'Candidats raw',     type:'bronze' },
    // Silver
    { id:'si1',  x:380, y:50,  w:130, h:36, label:'Participation',     type:'silver' },
    { id:'si2',  x:380, y:100, w:130, h:36, label:'Socio-éco',         type:'silver' },
    { id:'si3',  x:380, y:150, w:130, h:36, label:'Historique votes',  type:'silver' },
    { id:'si4',  x:380, y:200, w:130, h:36, label:'Cibles 2022',       type:'silver' },
    // QC
    { id:'qc',   x:560, y:120, w:100, h:52, label:'QC Gates\n(14 checks)', type:'qc' },
    // Gold
    { id:'gold', x:710, y:120, w:130, h:52, label:'Gold dataset\n1 268 × 113', type:'gold' },
    // Outputs
    { id:'out1', x:890, y:85,  w:110, h:36, label:'CSV export', type:'output' },
    { id:'out2', x:890, y:135, w:110, h:36, label:'PostgreSQL',  type:'output' },
    { id:'out3', x:890, y:185, w:110, h:36, label:'ML training', type:'output' },
  ];
  const colors = {
    source:'var(--bg-3)', bronze:'#92602c22', silver:'#88888822',
    gold:'#b8860b22', qc:'color-mix(in srgb,var(--status-warn) 15%,transparent)',
    output:'color-mix(in srgb,var(--d-1) 12%,transparent)',
  };
  const strokes = {
    source:'var(--ink-5)', bronze:'#92602c', silver:'#888', gold:'#b8860b', qc:'var(--status-warn)', output:'var(--d-1)'
  };
  const arrows = [
    ['src1','br1'],['src2','br2'],['src3','br3'],['src4','br4'],
    ['br1','si1'],['br2','si2'],['br3','si2'],['br4','si3'],['br4','si4'],
    ['si1','qc'],['si2','qc'],['si3','qc'],['si4','qc'],
    ['qc','gold'],['gold','out1'],['gold','out2'],['gold','out3'],
  ];
  const cx = n => n.x + n.w / 2;
  const cy = n => n.y + n.h / 2;
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });

  return (
    <section className="section">
      <div className="section-head">
        <div><span className="eyebrow">Diagramme de flux BPM</span>
          <h2>Architecture du pipeline — flux de données source → gold</h2></div>
        <span className="chip">Modèle BPM · 5 couches · sources publiques</span>
      </div>
      <div className="panel" style={{ overflowX: 'auto' }}>
        <svg viewBox="0 0 1020 260" style={{ width: '100%', minWidth: 700, display: 'block' }}>
          {/* Fond couches */}
          {[
            { x:20,  label:'Sources', color:'#f5f5f5' },
            { x:190, label:'BRONZE',  color:'#fdf3e7' },
            { x:370, label:'SILVER',  color:'#f5f5f5' },
            { x:550, label:'QC',      color:'#fffbf0' },
            { x:700, label:'GOLD',    color:'#fefce8' },
            { x:880, label:'Sorties', color:'#f0f7ff' },
          ].map(({ x, label, color }, i, arr) => {
            const w = (arr[i+1]?.x ?? 1010) - x;
            return (
              <g key={label}>
                <rect x={x} y={10} width={w-5} height={240} rx={4} fill={color} opacity="0.6" />
                <text x={x+8} y={25} fill="var(--ink-5)" fontSize="9" fontWeight="700"
                  fontFamily="var(--mono)" textTransform="uppercase">{label}</text>
              </g>
            );
          })}
          {/* Flèches */}
          {arrows.map(([a, b]) => {
            const na = byId[a], nb = byId[b];
            if (!na || !nb) return null;
            const x1 = na.x + na.w, y1 = cy(na);
            const x2 = nb.x, y2 = cy(nb);
            const mx = (x1 + x2) / 2;
            return (
              <path key={a+b}
                d={`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`}
                fill="none" stroke="var(--ink-4)" strokeWidth="1.2"
                markerEnd="url(#arrow)" opacity="0.7" />
            );
          })}
          {/* Marker flèche */}
          <defs>
            <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="var(--ink-4)" />
            </marker>
          </defs>
          {/* Noeuds */}
          {nodes.map(n => (
            <g key={n.id}>
              <rect x={n.x} y={n.y} width={n.w} height={n.h} rx="5"
                fill={colors[n.type] || '#fff'} stroke={strokes[n.type] || '#999'}
                strokeWidth={n.type === 'gold' ? 2 : 1.2}
                strokeDasharray={n.optional ? '4 3' : 'none'} />
              {n.label.split('\n').map((line, i) => (
                <text key={i} x={cx(n)} y={n.y + n.h/2 + (n.label.includes('\n') ? (i-0.5)*12 : 0) + 4}
                  fill="var(--ink)" fontSize="9.5" fontFamily="var(--sans)" textAnchor="middle"
                  fontWeight={n.type === 'gold' ? '700' : '400'}>{line}</text>
              ))}
            </g>
          ))}
        </svg>
        <div style={{ marginTop: 12, display: 'flex', gap: 20, flexWrap: 'wrap', fontSize: 11, color: 'var(--ink-4)' }}>
          {[['Sources','var(--bg-3)'],['Bronze','#92602c'],['Silver','#888'],['QC Gates','var(--status-warn)'],['Gold','#b8860b'],['Sorties','var(--d-1)']].map(([l,c]) => (
            <span key={l} style={{ display:'flex', alignItems:'center', gap:5 }}>
              <i style={{ width:14, height:10, borderRadius:2, background:c, opacity:.6 }} />{l}
            </span>
          ))}
          <span style={{ marginLeft:'auto' }}>Tirets = sources optionnelles (sécurité, entreprises, associations)</span>
        </div>
      </div>
    </section>
  );
}

              <span style={{ fontSize: 18, flexShrink: 0 }}>{icon}</span>

                <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 5 }}>{title}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.6 }}>{detail}</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}
