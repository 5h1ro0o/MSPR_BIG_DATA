<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Pipeline ETL — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">04 · Pipeline ETL</span>
        <span className="chip ok"><span className="live-dot"></span>Dernier run réussi</span>
        <span className="chip">run_id · 20260507T121254_2e4940</span>
      </div>
      <h1 className="headline-1">Du fichier brut au dataset ML — 14 étapes.</h1>
      <p className="dek">
        Architecture Medallion bronze / silver / gold. Fetch automatique depuis data.gouv.fr,
        transformation par couche, 14 quality gates, chargement PostgreSQL.
        Durée totale réelle : 1 min 33 s · 1 268 communes · 113 colonnes.
      </p>
    </section>
  );
}

function KPIs() {
  const kpis = [
    { lbl: 'Communes gold',    val: '1 268', unit: '',    note: '8 depts IDF' },
    { lbl: 'Colonnes features', val: '113',  unit: '',    note: '0 nulls' },
    { lbl: 'Quality gates',    val: '14/14', unit: '',    note: 'Tous passés' },
    { lbl: 'Durée ETL',        val: '93',    unit: 's',   note: 'Dont 78s candidats' },
  ];
  return (
    <div className="kpi-row" style={{ marginBottom: 48 }}>
      {kpis.map(k => (
        <div key={k.lbl} className="kpi">
          <div className="kpi-hd"><span className="label">{k.lbl}</span></div>
          <div className="kpi-value tnum">
            {k.val}<span className="unit">{k.unit}</span>
          </div>
          <div className="kpi-foot"><span style={{ color: 'var(--status-ok)' }}>{k.note}</span></div>
        </div>
      ))}
    </div>
  );
}

function Architecture() {
  const layers = [
    {
      tag: 'FETCH', color: 'var(--ink-5)',
      title: 'Ingestion automatique',
      sources: [
        'Élections présidentielles 2012 / 2017 / 2022',
        'INSEE RP 2022 — dossier_complet.csv',
        'Filosofi 2017 — revenus / pauvreté',
        'DS_RP_EMPLOI LR COMP 2022',
        'Chômage IDF historique',
      ],
      stats: 'API data.gouv.fr · retry exponentiel · ZIP / XLSX / CSV'
    },
    {
      tag: 'BRONZE', color: 'var(--d-8)',
      title: 'Extraction brute',
      sources: [
        '324 672 lignes élections brutes',
        '27 276 541 lignes candidats (chunks 200k)',
        '1 287 communes démographie',
        '1 288 communes pauvreté',
        '1 919 779 lignes emploi',
      ],
      stats: 'Lecture pandas · encodings multiples · zfill codes dept'
    },
    {
      tag: 'SILVER', color: 'var(--d-6)',
      title: 'Normalisation par couche',
      sources: [
        'silver.participation_elections · 1 268 communes',
        'silver.resultats_candidats · historique 2012/2017/2022',
        'silver.features_demographiques · 39 indicateurs',
        'silver.features_pauvrete · revenus médians',
        'silver.features_emploi · taux emploi 2022',
      ],
      stats: '7 tables silver · jointures sur code_commune · IQR outliers'
    },
    {
      tag: 'GOLD', color: 'var(--d-4)',
      title: 'Dataset ML',
      sources: [
        'gold.ml_features · 1 268 × 113',
        'Cibles : cible_t2_vainqueur (binaire)',
        'Anti-leakage : feature sets pre_vote / post_t1',
        'gold.model_predictions · résultats modèles',
        'gold.model_metrics · métriques par run',
      ],
      stats: '0 null · 0 doublon · QC 14/14 · PostgreSQL 16'
    },
  ];

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Architecture</span>
          <h2>Pipeline Medallion — fetch → bronze → silver → gold</h2>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
        {layers.map((l, i) => (
          <div key={l.tag} className="panel" style={{ position: 'relative', paddingTop: 40 }}>
            <div style={{
              position: 'absolute', top: 14, left: 16,
              fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 700,
              color: l.color, letterSpacing: '0.08em',
              background: 'color-mix(in srgb, ' + l.color + ' 10%, transparent)',
              padding: '3px 8px', borderRadius: 4,
            }}>{l.tag}</div>
            {i < 3 && (
              <div style={{
                position: 'absolute', top: '50%', right: -12,
                color: 'var(--ink-5)', fontSize: 16, zIndex: 1,
              }}>→</div>
            )}
            <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, color: 'var(--ink)' }}>{l.title}</h3>
            <ul style={{ listStyle: 'none', padding: 0, margin: '0 0 12px', fontSize: 11.5, color: 'var(--ink-3)', lineHeight: 1.6 }}>
              {l.sources.map((s, j) => (
                <li key={j} style={{ padding: '4px 0', borderBottom: '1px solid var(--line-soft)', fontFamily: 'var(--mono)', fontSize: 10.5 }}>
                  {s}
                </li>
              ))}
            </ul>
            <div style={{ fontSize: 10, color: 'var(--ink-5)', borderTop: '1px solid var(--line)', paddingTop: 8 }}>{l.stats}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function Steps() {
  const maxDur = Math.max(...MOCK.steps.map(s => s.dur));
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Chronologie</span>
          <h2>14 étapes — durées réelles (run 07/05/2026)</h2>
        </div>
        <span className="chip">Total ETL : 93,1 s</span>
      </div>
      <div className="panel">
        {MOCK.steps.map((s, i) => (
          <div key={s.name} style={{
            display: 'grid', gridTemplateColumns: '180px 1fr 60px',
            alignItems: 'center', gap: 12,
            padding: '8px 0',
            borderBottom: i < MOCK.steps.length - 1 ? '1px solid var(--line-soft)' : 'none',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-5)', minWidth: 24 }}>
                {String(i + 1).padStart(2, '0')}
              </span>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink)' }}>{s.name}</span>
            </div>
            <div style={{ height: 6, background: 'var(--bg-3)', borderRadius: 3, overflow: 'hidden' }}>
              <div style={{
                height: '100%',
                width: Math.max(0.5, (s.dur / maxDur) * 100) + '%',
                background: s.dur > 10 ? 'var(--d-2)' : s.dur > 2 ? 'var(--d-3)' : 'var(--status-ok)',
                borderRadius: 3,
              }} />
            </div>
            <div style={{ textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 11,
              color: s.dur > 10 ? 'var(--d-2)' : 'var(--ink-4)' }}>
              {s.dur.toFixed(1)}s
            </div>
          </div>
        ))}
        <div style={{ marginTop: 12, padding: '10px 0', borderTop: '1px solid var(--line)', fontSize: 12, color: 'var(--ink-4)' }}>
          L'étape <span style={{ fontFamily: 'var(--mono)', color: 'var(--d-2)' }}>extract_candidats</span> (78,5 s)
          traite 27 276 541 lignes en deux passes (historique + 2022) par chunks de 200 000 lignes.
        </div>
      </div>
    </section>
  );
}

function History() {
  const colorOf = s => s === 'SUCCESS' ? 'ok' : s === 'WARN' ? 'warn' : 'err';
  return (
    <section className="section">
      <div className="section-head">
        <div><span className="eyebrow">Historique</span><h2>Derniers runs pipeline</h2></div>
      </div>
      <div className="grid-12">
        <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
          <table className="tbl">
            <thead>
              <tr>
                <th>Run ID</th>
                <th>Lancé</th>
                <th>Durée</th>
                <th className="num">Communes</th>
                <th className="num">Nulls</th>
                <th>QC</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody>
              {MOCK.runs.map(r => (
                <tr key={r.id}>
                  <td className="mono" style={{ color: 'var(--ink-4)', fontSize: 10.5 }}>{r.id.slice(0, 22)}</td>
                  <td style={{ fontSize: 12 }}>{r.start}</td>
                  <td className="mono tnum">{r.dur}</td>
                  <td className="num tnum">{typeof r.communes === 'number' ? r.communes.toLocaleString('fr-FR') : r.communes}</td>
                  <td className="num tnum">{r.nulls}</td>
                  <td>
                    <span className={'chip ' + (r.qc === 'OK' ? 'ok' : r.qc === 'WARN' ? 'warn' : 'err')}>
                      <span className="dot" />{r.qc}
                    </span>
                  </td>
                  <td>
                    <span className={'chip ' + colorOf(r.status)}>
                      <span className="dot" />{r.status}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="panel">
          <div className="panel-hd"><h3>Logs — dernier run</h3><span className="chip ok"><span className="live-dot" />tail</span></div>
          <div className="logblock">
            {[
              ['12:12:54', 'INFO',  'run_all',              'ÉTAPE 1/3 : FETCH data.gouv.fr'],
              ['12:12:54', 'INFO',  'datagouv',             '[SKIP] 5/5 datasets déjà présents'],
              ['12:12:54', 'INFO',  'run_all',              'Fetch terminé en 0.5s — 5/5 OK'],
              ['12:12:54', 'INFO',  'run_all',              'ÉTAPE 2/3 : ETL'],
              ['12:12:55', 'INFO',  'extract.elections',    'Elections brutes : 324 672 lignes'],
              ['12:13:02', 'INFO',  'extract.demographique','Démographique : 1 287 lignes × 42 cols'],
              ['12:13:05', 'INFO',  'extract.pauvrete',     'Pauvreté : 1 288 lignes'],
              ['12:13:07', 'INFO',  'extract.emploi',       'Emploi 2022 : 1 919 779 lignes'],
              ['12:13:47', 'INFO',  'extract.candidats',    'Candidats historique : 179 233 lignes'],
              ['12:14:26', 'INFO',  'extract.candidats',    'Candidats 2022 : 103 054 lignes'],
              ['12:14:26', 'INFO',  'transform.assemble',   'Fusion silver → gold...'],
              ['12:14:27', 'INFO',  'assemble',             'Dataset gold : 1 268 × 113 | 0 nulls'],
              ['12:14:27', 'WARN',  'quality.checks',       '2 communes somme T2 hors [95,105]%'],
              ['12:14:27', 'INFO',  'quality.checks',       'PASSED (14/14) · QC=OK'],
              ['12:14:27', 'INFO',  'load.csv',             'dataset_elections_2022_idf.csv écrit'],
              ['12:14:27', 'INFO',  'run_all',              'ETL terminé en 93.0s'],
              ['12:14:27', 'INFO',  'run_all',              'ÉTAPE 3/3 : ENTRAÎNEMENT ML'],
              ['12:14:35', 'INFO',  'trainer',              'RF pre_vote : accuracy=0.9094'],
              ['12:14:38', 'INFO',  'trainer',              'GB pre_vote : accuracy=0.9016'],
              ['12:14:44', 'INFO',  'trainer',              'RF post_t1  : accuracy=0.9370'],
              ['12:14:47', 'INFO',  'trainer',              'GB post_t1  : accuracy=0.9567'],
              ['12:14:48', 'INFO',  'run_all',              'PIPELINE SUCCESS | 114s total'],
            ].map(([ts, lvl, mod, msg], i) => (
              <div key={i}>
                <span className="ts">{ts}</span>
                {' '}
                <span className={lvl === 'INFO' ? 'info' : lvl === 'WARN' ? 'warn' : 'ok'}>{lvl}</span>
                {' '}
                <span style={{ color: 'var(--ink-5)', fontFamily: 'var(--mono)', fontSize: 10 }}>{mod}</span>
                {'  '}
                {msg}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="pipeline" />
      <main className="shell">
        <Header />
        <KPIs />
        <Architecture />
        <Steps />
        <History />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
