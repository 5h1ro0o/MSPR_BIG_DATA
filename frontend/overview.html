<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Résultats 2022 — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">Présidentielle 2022 · Île-de-France</span>
        <span className="chip">1 268 communes · 8 départements</span>
        <span className="chip">Source : Ministère de l'Intérieur</span>
      </div>
      <h1 className="headline-1">Résultats électoraux IDF 2022 — vue complète.</h1>
      <p className="dek">
        Résultats du premier et second tour, comparaison avec les prédictions ML,
        profils socio-économiques des électorats, participation historique et corrélations INSEE.
      </p>
    </section>
  );
}

function KPIs({ predMacronT2 }) {
  const mlNote = predMacronT2 != null ? 'Prédiction ML — GB post-T1' : 'Chargement…';
  const predVal = predMacronT2 != null ? predMacronT2.toFixed(1).replace('.', ',') : '—';
  const predLP  = predMacronT2 != null ? (100 - predMacronT2).toFixed(1).replace('.', ',') : '—';
  const kpis = [
    { lbl: 'Communes IDF',       val: '1 268',  unit: '',  note: 'Couverture intégrale',         spark: [1200,1240,1255,1260,1265,1268,1268] },
    { lbl: 'Participation T1',   val: '73,6',   unit: '%', note: '+2,1 pts vs national',         spark: [72.0,84.5,80.4,78.9,73.6] },
    { lbl: 'Abstention T1',      val: '26,4',   unit: '%', note: 'IDF 2022',                     spark: [28,15.5,19.6,21.1,26.4] },
    { lbl: 'Macron T2 — prédit', val: predVal,  unit: '%', note: mlNote,                         spark: predMacronT2 != null ? [58,60,62,63,64,predMacronT2] : [60,62,64,65,66,67] },
    { lbl: 'Le Pen T2 — prédite',val: predLP,   unit: '%', note: predMacronT2 != null ? 'Prédiction ML (100 − Macron)' : 'Chargement…', spark: predMacronT2 != null ? [42,40,38,37,36,100-predMacronT2] : [38,36,34,33,32] },
  ];
  return (
    <div className="kpi-row" style={{ marginBottom: 48 }}>
      {kpis.map(k => (
        <div key={k.lbl} className="kpi">
          <div className="kpi-hd"><span className="label">{k.lbl}</span></div>
          <div className="kpi-value tnum">{k.val}<span className="unit">{k.unit}</span></div>
          <Sparkline data={k.spark} height={26} />
          <div className="kpi-foot"><span style={{ color: 'var(--ink-4)' }}>{k.note}</span></div>
        </div>
      ))}
    </div>
  );
}

const T1_META = [
  { key: 't1_macron',    name: 'Emmanuel Macron',    party: 'LREM', color: 'var(--d-1)' },
  { key: 't1_melenchon', name: 'Jean-Luc Mélenchon', party: 'LFI',  color: 'var(--d-3)' },
  { key: 't1_lepen',     name: 'Marine Le Pen',       party: 'RN',   color: 'var(--d-2)' },
  { key: 't1_zemmour',   name: 'Éric Zemmour',        party: 'REC',  color: 'var(--d-4)' },
  { key: 't1_pecresse',  name: 'Valérie Pécresse',    party: 'LR',   color: 'var(--d-5)' },
  { key: 't1_jadot',     name: 'Yannick Jadot',       party: 'EELV', color: 'var(--d-6)' },
  { key: 't1_autres',    name: 'Autres',               party: '',     color: 'var(--ink-4)' },
];

function T1Results({ t1Candidates }) {
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">1er tour · 10 avril 2022</span>
          <h2>Résultats T1 — candidats IDF</h2>
        </div>
        <span className="chip">Données pipeline · moyenne par commune</span>
      </div>
      {t1Candidates ? (
        <div className="grid-12">
          <div className="panel">
            <BarList rows={t1Candidates} />
            <div style={{ marginTop: 16 }}>
              <div style={{ display: 'flex', height: 16, borderRadius: 4, overflow: 'hidden', gap: 1 }}>
                {t1Candidates.map((c, i) => (
                  <div key={i} title={c.name + ' ' + c.value.toFixed(1) + '%'}
                    style={{ width: c.value + '%', background: c.color, minWidth: 2 }} />
                ))}
              </div>
              <div style={{ marginTop: 8, fontSize: 11, color: 'var(--ink-4)' }}>
                {`Moyenne non pondérée sur 1 268 communes · les deux premiers totalisent ${t1Candidates.slice(0,2).reduce((s,c)=>s+c.value,0).toFixed(1)}% des voix IDF.`}
              </div>
            </div>
          </div>
          <div className="panel">
            <div className="panel-hd"><h3>Participation T1 par département</h3></div>
            <div className="bar-list">
              {[...MOCK.depts].sort((a, b) => b.part - a.part).map((d) => (
                <div key={d.code} className="bar-row">
                  <div className="rank" style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>{d.code}</div>
                  <div className="nm">{d.nom}<small>{d.communes} communes</small></div>
                  <div className="br"><i style={{ width: d.part + '%', background: 'var(--d-1)' }} /></div>
                  <div className="pc tnum">{d.part.toFixed(1)}<small>%</small></div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 14, padding: '10px 12px', background: 'var(--bg-2)', borderRadius: 6, fontSize: 11.5, color: 'var(--ink-3)', lineHeight: 1.5 }}>
              Participation plus forte dans les Yvelines (82,4%) et Hauts-de-Seine (79,1%).
              Seine-Saint-Denis présente la plus faible participation (64,5%).
            </div>
          </div>
        </div>
      ) : (
        <div className="panel" style={{ color: 'var(--ink-4)', fontSize: 13 }}>
          Prédictions T1 non disponibles — lancez <code>run_all.py</code> pour générer les artéfacts ML.
        </div>
      )}
    </section>
  );
}

function T2Results({ predMacronT2, predDepts }) {
  const predLP = predMacronT2 != null ? 100 - predMacronT2 : null;
  const MC = 'var(--d-1)', LP = 'var(--d-2)';
  const depts = predDepts && predDepts.length ? predDepts : [];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">2ème tour · 24 avril 2022</span>
          <h2>Prédiction ML T2 — Gradient Boosting post-T1</h2>
        </div>
        <a href="comparison.html" className="btn ghost" style={{ fontSize: 12 }}>Comparaison détaillée →</a>
      </div>
      {predMacronT2 != null ? (
        <div className="panel">
          <div className="eyebrow" style={{ marginBottom: 14 }}>Score prédit — IDF 2022 · moyenne des 1 268 communes</div>
          <div style={{ display: 'flex', height: 16, borderRadius: 8, overflow: 'hidden', marginBottom: 20 }}>
            <div style={{ width: predMacronT2 + '%', background: MC }} />
            <div style={{ width: predLP + '%', background: LP }} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, marginBottom: 16 }}>
            {[['Emmanuel Macron', predMacronT2, MC], ['Marine Le Pen', predLP, LP]].map(([n, v, c]) => (
              <div key={n} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <span style={{ fontSize: 12, color: c, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{n}</span>
                <span className="tnum" style={{ fontSize: 36, fontWeight: 700, color: c, lineHeight: 1 }}>{v.toFixed(1)}<span style={{ fontSize: 18 }}>%</span></span>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--ink-4)', lineHeight: 1.6 }}>
            Entraîné sur features socio-économiques INSEE + résultats T1 2022 · modèle Gradient Boosting (post-T1).
          </div>
        </div>
      ) : (
        <div className="panel" style={{ color: 'var(--ink-4)', fontSize: 13 }}>
          Prédictions non disponibles — lancez <code>run_all.py</code> pour générer les artéfacts ML.
        </div>
      )}
      {/* Dept breakdown T2 prédit */}
      <div className="panel" style={{ marginTop: 16 }}>
        <div className="panel-hd"><h3>T2 prédit par département IDF</h3></div>
        {depts.length > 0 ? (
          <div className="bar-list">
            {[...depts].sort((a, b) => b.macronPred - a.macronPred).map((d) => (
              <div key={d.code} className="bar-row">
                <div className="rank" style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>{d.code}</div>
                <div className="nm">{d.nom}<small>{d.communes} communes</small></div>
                <div className="br"><i style={{ width: d.macronPred + '%', background: 'var(--d-1)' }} /></div>
                <div className="pc tnum">{d.macronPred.toFixed(1)}<small>%</small></div>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ padding: '16px 0', color: 'var(--ink-4)', fontSize: 13 }}>
            Lancez <code>run_all.py</code> pour charger les prédictions par département.
          </div>
        )}
        <div style={{ marginTop: 14, padding: '10px 12px', background: 'var(--bg-2)', borderRadius: 6, fontSize: 11.5, color: 'var(--ink-3)', lineHeight: 1.5 }}>
          {predDepts && predDepts.length
            ? 'Moyennes des prédictions ML par département · score prédit Macron T2.'
            : 'Prédictions par département non disponibles — relancez le pipeline pour charger les données.'}
        </div>
      </div>
    </section>
  );
}

function ElectoratProfiles() {
  const profiles = [
    { label: 'Macron',     color: 'var(--d-1)', cadres: 38, ouvriers:  8, diplSup: 52, hlm: 12, revenu: 31200 },
    { label: 'Mélenchon', color: 'var(--d-3)', cadres: 18, ouvriers: 22, diplSup: 31, hlm: 28, revenu: 21400 },
    { label: 'Le Pen',     color: 'var(--d-2)', cadres: 11, ouvriers: 28, diplSup: 18, hlm: 34, revenu: 18900 },
    { label: 'Pécresse',   color: 'var(--d-5)', cadres: 42, ouvriers:  6, diplSup: 55, hlm:  9, revenu: 34500 },
  ];
  const indicators = [
    { key: 'cadres',   label: '% cadres',        unit: '%', max: 55 },
    { key: 'ouvriers', label: '% ouvriers',       unit: '%', max: 40 },
    { key: 'diplSup',  label: '% diplômés Bac+3', unit: '%', max: 65 },
    { key: 'hlm',      label: '% HLM',            unit: '%', max: 45 },
    { key: 'revenu',   label: 'Revenu médian',     unit: '€', max: 40000,
      fmt: v => v.toLocaleString('fr-FR') },
  ];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Sociologie électorale</span>
          <h2>Profil socio-économique des électorats</h2>
        </div>
        <p>Caractéristiques moyennes des communes remportées par chaque candidat — IDF 2022 · source INSEE RP 2022 + Filosofi 2017.</p>
      </div>
      <div className="panel">
        <div style={{ display: 'grid', gridTemplateColumns: '160px repeat(4, 1fr)', gap: '0 12px' }}>
          <div />
          {profiles.map(p => (
            <div key={p.label} style={{ textAlign: 'center', paddingBottom: 14, borderBottom: '2px solid ' + p.color }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: p.color }}>{p.label}</div>
            </div>
          ))}
          {indicators.map(ind => (
            <React.Fragment key={ind.key}>
              <div style={{ fontSize: 12, color: 'var(--ink-4)', padding: '9px 12px 9px 0',
                borderBottom: '1px solid var(--line-soft)', whiteSpace: 'nowrap' }}>{ind.label}</div>
              {profiles.map(p => {
                const val = p[ind.key];
                const fmt = ind.fmt ? ind.fmt(val) : val;
                return (
                  <div key={p.label} style={{ padding: '9px 4px', borderBottom: '1px solid var(--line-soft)' }}>
                    <div style={{ fontSize: 13, fontWeight: 600, textAlign: 'center', marginBottom: 4 }}>
                      {fmt}{ind.unit !== '€' ? ind.unit : ''}
                      {ind.unit === '€' && <span style={{ fontSize: 11, color: 'var(--ink-4)' }}> €</span>}
                    </div>
                    <div style={{ height: 4, borderRadius: 2, background: 'var(--bg-3)', overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: Math.min(100, (val / ind.max) * 100) + '%', background: p.color }} />
                    </div>
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    </section>
  );
}

function Participation() {
  const years = [2002, 2007, 2012, 2017, 2022];
  const part  = [72.0, 84.5, 80.4, 78.9, 73.6];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Évolution historique</span>
          <h2>Participation T1 — IDF 2002–2022</h2>
        </div>
        <p>Source : Ministère de l'Intérieur. Pic en 2007 (84,5%) — recul progressif depuis.</p>
      </div>
      <div className="panel">
        <svg viewBox="0 0 800 260" style={{ width: '100%', height: 260, display: 'block' }}>
          {[60, 70, 80, 90, 100].map((y, i) => (
            <g key={y}>
              <line x1="50" x2="780" y1={240 - (y - 50) * 3.8} y2={240 - (y - 50) * 3.8}
                stroke="var(--line)" strokeDasharray={i === 4 ? '' : '2 4'} />
              <text x="4" y={240 - (y - 50) * 3.8 + 4} fill="var(--ink-5)" fontSize="10"
                fontFamily="var(--mono)">{y}%</text>
            </g>
          ))}
          {(() => {
            const xs = years.map((_, i) => 70 + i * 170);
            const py = v => 240 - (v - 50) * 3.8;
            const pathStr = vs => vs.map((v, i) => (i ? 'L' : 'M') + xs[i] + ' ' + py(v)).join(' ');
            return (
              <>
                <path d={pathStr(part) + ' L ' + xs[4] + ' 240 L ' + xs[0] + ' 240 Z'}
                  fill="var(--d-1)" opacity="0.08" />
                <path d={pathStr(part)} fill="none" stroke="var(--d-1)" strokeWidth="2.5" />
                {xs.map((x, i) => (
                  <g key={i}>
                    <circle cx={x} cy={py(part[i])} r="6" fill="var(--surface-solid)"
                      stroke="var(--d-1)" strokeWidth="2.5" />
                    <text x={x} y={py(part[i]) - 12} fill="var(--ink)" fontSize="13"
                      fontFamily="var(--mono)" textAnchor="middle" fontWeight="700">
                      {part[i].toFixed(1)}%
                    </text>
                    <text x={x} y="258" fill="var(--ink-4)" fontSize="12"
                      fontFamily="var(--sans)" textAnchor="middle">{years[i]}</text>
                  </g>
                ))}
              </>
            );
          })()}
        </svg>
      </div>
    </section>
  );
}

function Heatmap() {
  const cols = ['Cadres', 'Ouvriers', 'Dipl. sup.', 'Senior 60+', 'HLM', 'Pauvreté', 'Chômage'];
  const rows = ['Macron T2', 'Le Pen T2', 'Mélenchon T1', 'Zemmour T1', 'Pécresse T1'];
  const data = [
    [ 0.72, -0.61,  0.78,  0.18, -0.42, -0.55, -0.39],
    [-0.71,  0.62, -0.78, -0.18,  0.42,  0.55,  0.41],
    [-0.18,  0.34, -0.12, -0.28,  0.51,  0.48,  0.37],
    [ 0.11,  0.04, -0.05,  0.08, -0.32, -0.21, -0.16],
    [ 0.62, -0.32,  0.51,  0.34, -0.42, -0.41, -0.31],
  ];
  const cell = v => {
    const a = Math.abs(v);
    const c = v >= 0 ? 'var(--d-1)' : 'var(--d-2)';
    return { background: 'color-mix(in srgb, ' + c + ' ' + (a * 68).toFixed(0) + '%, var(--surface-solid))',
      color: a > 0.45 ? '#fff' : 'var(--ink)' };
  };
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Corrélations socio-électorales</span>
          <h2>Pearson r — indicateurs INSEE × résultats par commune</h2>
        </div>
        <p>Calculé sur les 1 268 communes IDF · p &lt; 0,001 · source : croisement ETL pipeline gold.</p>
      </div>
      <div className="heatmap" style={{ gridTemplateColumns: '160px repeat(' + cols.length + ', 1fr)' }}>
        <div className="hcell head"></div>
        {cols.map(c => <div key={c} className="hcell head">{c}</div>)}
        {rows.map((r, ri) => (
          <React.Fragment key={r}>
            <div className="hcell head" style={{ aspectRatio: 'auto', justifyContent: 'flex-start', padding: '0 14px' }}>{r}</div>
            {data[ri].map((v, ci) => (
              <div key={ci} className="hcell tnum" style={cell(v)}>{(v >= 0 ? '+' : '') + v.toFixed(2)}</div>
            ))}
          </React.Fragment>
        ))}
      </div>
      <div style={{ marginTop: 14, fontSize: 12, color: 'var(--ink-4)', display: 'flex', gap: 20, flexWrap: 'wrap' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <i style={{ display: 'inline-block', width: 32, height: 8,
            background: 'linear-gradient(90deg, var(--d-2), var(--bg-2), var(--d-1))', borderRadius: 2 }} />
          −1,0 · 0 · +1,0
        </span>
        <span>Corrélation la plus forte : % diplômés sup. ↔ Macron T2 (r = +0,78)</span>
        <span style={{ marginLeft: 'auto' }}>% cadres ↔ Le Pen T2 : r = −0,61</span>
      </div>
    </section>
  );
}

const DEPT_INFO = {
  '75': { nom: 'Paris',             communes: 20  },
  '92': { nom: 'Hauts-de-Seine',    communes: 36  },
  '78': { nom: 'Yvelines',          communes: 262 },
  '91': { nom: 'Essonne',           communes: 196 },
  '94': { nom: 'Val-de-Marne',      communes: 47  },
  '93': { nom: 'Seine-Saint-Denis', communes: 40  },
  '77': { nom: 'Seine-et-Marne',    communes: 514 },
  '95': { nom: "Val-d'Oise",        communes: 153 },
};

function App() {
  const [predMacronT2,  setPredMacronT2]  = useState(null);
  const [predDepts,     setPredDepts]     = useState([]);
  const [t1Candidates,  setT1Candidates]  = useState(null);

  useEffect(() => {
    Promise.all([loadArtifacts(), loadPredictions()]).then(([, preds]) => {
      const best = preds?.gb_post_t1 ?? preds?.gb_pre_vote ?? preds?.rf_post_t1;
      if (!best?.rows?.length) return;

      const rows = best.rows;
      const validRows = rows.filter(r => r.score_macron_predit != null && !isNaN(r.score_macron_predit));

      // IDF moyenne T2 prédite
      if (validRows.length) {
        const avg = validRows.reduce((s, r) => s + r.score_macron_predit, 0) / validRows.length;
        setPredMacronT2(avg);
      }

      // T1 — moyennes par commune depuis le CSV pipeline
      const validT1 = rows.filter(r => r.t1_macron != null && r.t1_macron > 0);
      if (validT1.length) {
        const cands = T1_META.map(c => ({
          ...c,
          value: validT1.reduce((s, r) => s + (r[c.key] || 0), 0) / validT1.length,
        })).filter(c => c.value > 0.05).sort((a, b) => b.value - a.value);
        if (cands.length >= 3) {
          setT1Candidates(cands);
        } else {
          setT1Candidates(MOCK.candidatesT1);
        }
      } else {
        setT1Candidates(MOCK.candidatesT1);
      }

      // T2 — agrégation par département
      const deptAcc = {};
      validRows.forEach(r => {
        const code = r.code_departement;
        if (!code) return;
        if (!deptAcc[code]) deptAcc[code] = { sum: 0, count: 0 };
        deptAcc[code].sum   += r.score_macron_predit;
        deptAcc[code].count += 1;
      });
      const depts = Object.entries(deptAcc)
        .filter(([code]) => DEPT_INFO[code])
        .map(([code, { sum, count }]) => ({
          code,
          nom:        DEPT_INFO[code].nom,
          communes:   DEPT_INFO[code].communes,
          macronPred: sum / count,
        }));
      if (depts.length) setPredDepts(depts);
    });
  }, []);

  return (
    <>
      <Topbar active="overview" />
      <main className="shell">
        <Header />
        <KPIs predMacronT2={predMacronT2} />
        <T1Results t1Candidates={t1Candidates} />
        <T2Results predMacronT2={predMacronT2} predDepts={predDepts} />
        <ElectoratProfiles />
        <Participation />
        <Heatmap />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
