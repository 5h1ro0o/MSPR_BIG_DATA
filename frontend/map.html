<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Carte d&apos;\u00cele-de-France — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">03 \u00b7 Cartographie</span>
      </div>
      <h1 className="headline-1">L&apos;\u00cele-de-France, commune par commune.</h1>
      <p className="dek">Repr\u00e9sentation hexagonale stylis\u00e9e des 1\u202f268 communes. Chaque cellule encode une mesure\u202f: participation, vainqueur, marge, intensit\u00e9 du score.</p>
    </section>
  );
}

function Map() {
  const [mode, setMode] = React.useState('vainqueur');
  const cols = 24, rows = 16;
  const cells = [];
  const cx = cols / 2, cy = rows / 2;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const dist = Math.hypot(x - cx, y - cy);
      if (dist > 9 + Math.random() * 2) continue;
      const seed = (x * 31 + y * 17) % 100;
      const macron = 0.45 + (1 - dist/12) * 0.25 + (seed % 17) / 100 * 0.4;
      const lepen  = 1 - macron;
      const part   = 0.55 + (1 - Math.abs(dist - 5) / 8) * 0.25 + (seed % 13) / 100 * 0.2;
      cells.push({ x, y, macron, lepen, part });
    }
  }
  const W = 880, H = 520;
  const hexW = 30, hexH = 34;
  const colorFor = (c) => {
    if (mode === 'vainqueur') {
      const w = c.macron > c.lepen ? 'var(--d-1)' : 'var(--d-2)';
      const intensity = Math.abs(c.macron - 0.5) * 2;
      return 'color-mix(in srgb, '+w+' '+(20+intensity*70).toFixed(0)+'%, var(--surface-solid))';
    }
    if (mode === 'participation') {
      const t = (c.part - 0.55) / 0.4;
      return 'color-mix(in srgb, var(--d-3) '+(15+Math.max(0,Math.min(1,t))*75).toFixed(0)+'%, var(--surface-solid))';
    }
    return 'color-mix(in srgb, var(--d-1) '+(c.macron*80).toFixed(0)+'%, var(--surface-solid))';
  };

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Cartographie hexagonale</span>
          <h2>{mode==='vainqueur' ? 'Vainqueur du T2 par commune' : mode==='participation' ? 'Taux de participation T1' : 'Score Macron T2'}</h2>
        </div>
        <div className="tabs">
          <button className={mode==='vainqueur'?'active':''} onClick={()=>setMode('vainqueur')}>Vainqueur T2</button>
          <button className={mode==='participation'?'active':''} onClick={()=>setMode('participation')}>Participation</button>
          <button className={mode==='macron'?'active':''} onClick={()=>setMode('macron')}>Intensit\u00e9 Macron</button>
        </div>
      </div>
      <div className="grid-12" style={{alignItems:'stretch'}}>
        <div className="map-stage" style={{aspectRatio:'auto', minHeight: 540}}>
          <span className="map-corner tl">\u00cele-de-France \u00b7 1\u202f268 cellules</span>
          <span className="map-corner tr">Pr\u00e9sidentielle 2022 \u00b7 T2</span>
          <span className="map-corner bl">Source\u202f: pipeline gold</span>
          <span className="map-corner br">N = 1\u202f268</span>
          <svg viewBox={'0 0 '+W+' '+H} preserveAspectRatio="xMidYMid meet">
            {cells.map((c, i) => {
              const px = 60 + c.x * hexW + (c.y % 2) * (hexW / 2);
              const py = 50 + c.y * hexH * 0.85;
              const pts = [];
              for (let a = 0; a < 6; a++) {
                const ang = (Math.PI / 3) * a + Math.PI / 6;
                pts.push((px+Math.cos(ang)*16).toFixed(1)+','+(py+Math.sin(ang)*16).toFixed(1));
              }
              return <polygon key={i} className="map-tile" points={pts.join(' ')} fill={colorFor(c)} stroke="var(--line)" strokeWidth="0.8"/>;
            })}
          </svg>
        </div>
        <div style={{display:'flex', flexDirection:'column', gap: 24}}>
          <div className="panel">
            <div className="panel-hd"><h3>L\u00e9gende</h3><span className="chip">Mode {mode}</span></div>
            {mode === 'vainqueur' && (
              <>
                <div style={{display:'flex', gap: 18, alignItems:'center', marginBottom: 16}}>
                  <span className="chip" style={{borderColor:'var(--d-1)', color:'var(--d-1)'}}><span className="dot" style={{background:'var(--d-1)'}}></span>Macron</span>
                  <span className="chip" style={{borderColor:'var(--d-2)', color:'var(--d-2)'}}><span className="dot" style={{background:'var(--d-2)'}}></span>Le Pen</span>
                </div>
                <div style={{height: 12, borderRadius: 999, background:'linear-gradient(90deg, var(--d-2), var(--bg-2), var(--d-1))'}}/>
                <div style={{display:'flex', justifyContent:'space-between', marginTop: 6, fontSize: 11, color:'var(--ink-4)', fontFamily:'var(--mono)'}}>
                  <span>Marge \u00e9lev\u00e9e RN</span><span>50/50</span><span>Marge \u00e9lev\u00e9e LREM</span>
                </div>
              </>
            )}
            {mode !== 'vainqueur' && (
              <>
                <div style={{height: 12, borderRadius: 999, background:'linear-gradient(90deg, var(--surface-solid), '+(mode==='participation'?'var(--d-3)':'var(--d-1)')+')', border:'1px solid var(--line)'}}/>
                <div style={{display:'flex', justifyContent:'space-between', marginTop: 6, fontSize: 11, color:'var(--ink-4)', fontFamily:'var(--mono)'}}>
                  <span>{mode==='participation'?'55%':'40%'}</span><span>{mode==='participation'?'95%':'85%'}</span>
                </div>
              </>
            )}
          </div>
          <div className="panel">
            <div className="panel-hd"><h3>Top territoires</h3></div>
            <BarList rows={[
              { name: 'Paris 7e',        party: '75 \u00b7 LREM',   value: 78.4, color: 'var(--d-1)' },
              { name: 'Neuilly-s-Seine', party: '92 \u00b7 LREM',   value: 76.9, color: 'var(--d-1)' },
              { name: 'Versailles',      party: '78 \u00b7 LREM',   value: 71.3, color: 'var(--d-1)' },
              { name: 'Saint-Denis',     party: '93 \u00b7 LFI/RN', value: 53.2, color: 'var(--d-2)' },
              { name: 'Meaux',           party: '77 \u00b7 RN',     value: 51.7, color: 'var(--d-2)' },
            ]} max={100}/>
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="map" />
      <main className="shell">
        <Header />
        <Map />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
