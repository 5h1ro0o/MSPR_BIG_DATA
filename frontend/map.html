<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Carte Île-de-France — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState } = React;

// Carte schématique IDF — positions normalisées dans un viewBox 600x500
// Basé sur la géographie réelle des 8 départements IDF
const DEPT_SHAPES = [
  // Paris (75) — cercle central
  { code: '75', nom: 'Paris', cx: 300, cy: 235, r: 30, shape: 'circle' },
  // Hauts-de-Seine (92) — ouest de Paris
  { code: '92', nom: 'Hauts-de-Seine', points: '220,195 270,195 270,275 220,275', shape: 'rect', x: 220, y: 195, w: 50, h: 80 },
  // Seine-Saint-Denis (93) — nord-est
  { code: '93', nom: 'Seine-Saint-Denis', points: '330,150 410,150 410,235 330,235', shape: 'rect', x: 330, y: 150, w: 80, h: 85 },
  // Val-de-Marne (94) — sud-est
  { code: '94', nom: 'Val-de-Marne', points: '330,265 410,265 410,340 330,340', shape: 'rect', x: 330, y: 265, w: 80, h: 75 },
  // Seine-et-Marne (77) — est, grand
  { code: '77', nom: 'Seine-et-Marne', points: '410,130 570,130 570,420 410,420', shape: 'rect', x: 410, y: 130, w: 160, h: 290 },
  // Yvelines (78) — ouest, grand
  { code: '78', nom: 'Yvelines', points: '60,170 220,170 220,360 60,360', shape: 'rect', x: 60, y: 170, w: 160, h: 190 },
  // Essonne (91) — sud
  { code: '91', nom: 'Essonne', points: '180,340 410,340 410,460 180,460', shape: 'rect', x: 180, y: 340, w: 230, h: 120 },
  // Val-d'Oise (95) — nord
  { code: '95', nom: "Val-d'Oise", points: '60,60 410,60 410,170 60,170', shape: 'rect', x: 60, y: 60, w: 350, h: 110 },
];

// Labels centrés par département
const DEPT_LABELS = {
  '75': { x: 300, y: 240 },
  '92': { x: 245, y: 235 },
  '93': { x: 370, y: 192 },
  '94': { x: 370, y: 302 },
  '77': { x: 490, y: 275 },
  '78': { x: 140, y: 265 },
  '91': { x: 295, y: 400 },
  '95': { x: 235, y: 115 },
};

function DeptMap({ mode }) {
  const [hovered, setHovered] = useState(null);

  const getColor = (dept) => {
    if (mode === 'vainqueur') {
      const intensity = Math.round(20 + (dept.macronT2 / 100) * 70);
      return `color-mix(in srgb, var(--d-1) ${intensity}%, var(--surface-solid))`;
    }
    if (mode === 'participation') {
      const t = Math.round(15 + ((dept.part - 55) / 30) * 75);
      return `color-mix(in srgb, var(--d-3) ${Math.max(10, Math.min(90, t))}%, var(--surface-solid))`;
    }
    // mode lepen
    const intensity = Math.round(15 + (dept.lepEnT2 / 50) * 65);
    return `color-mix(in srgb, var(--d-2) ${Math.max(10, Math.min(85, intensity))}%, var(--surface-solid))`;
  };

  const getValue = (dept) => {
    if (mode === 'vainqueur') return dept.macronT2.toFixed(1) + '% Macron';
    if (mode === 'participation') return dept.part.toFixed(1) + '% part.';
    return dept.lepEnT2.toFixed(1) + '% Le Pen';
  };

  const deptByCode = {};
  MOCK.depts.forEach(d => { deptByCode[d.code] = d; });

  return (
    <svg viewBox="0 0 600 520" style={{ width: '100%', maxWidth: 560, display: 'block', margin: '0 auto' }}>
      {DEPT_SHAPES.map(shape => {
        const dept = deptByCode[shape.code];
        if (!dept) return null;
        const fill = getColor(dept);
        const isHov = hovered === shape.code;
        const label = DEPT_LABELS[shape.code];

        let elem;
        if (shape.shape === 'circle') {
          elem = (
            <circle
              cx={shape.cx} cy={shape.cy} r={shape.r}
              fill={fill}
              stroke={isHov ? 'var(--ink)' : 'var(--line-strong)'}
              strokeWidth={isHov ? 2 : 1}
              style={{ cursor: 'pointer', transition: 'all 0.15s' }}
              onMouseEnter={() => setHovered(shape.code)}
              onMouseLeave={() => setHovered(null)}
            />
          );
        } else {
          elem = (
            <rect
              x={shape.x} y={shape.y} width={shape.w} height={shape.h}
              rx="4"
              fill={fill}
              stroke={isHov ? 'var(--ink)' : 'var(--line-strong)'}
              strokeWidth={isHov ? 2 : 1}
              style={{ cursor: 'pointer', transition: 'all 0.15s' }}
              onMouseEnter={() => setHovered(shape.code)}
              onMouseLeave={() => setHovered(null)}
            />
          );
        }

        return (
          <g key={shape.code}>
            {elem}
            <text x={label.x} y={label.y - 8} textAnchor="middle"
              fontSize={shape.code === '77' || shape.code === '78' || shape.code === '95' ? 11 : 10}
              fontFamily="var(--mono)" fontWeight="600" fill="var(--ink)" pointerEvents="none">
              {shape.code}
            </text>
            <text x={label.x} y={label.y + 7} textAnchor="middle"
              fontSize={shape.code === '77' || shape.code === '78' || shape.code === '95' ? 9.5 : 9}
              fontFamily="var(--sans)" fill="var(--ink-3)" pointerEvents="none">
              {dept.communes} com.
            </text>
          </g>
        );
      })}

      {/* Tooltip on hover */}
      {hovered && (() => {
        const dept = deptByCode[hovered];
        const label = DEPT_LABELS[hovered];
        const tx = label.x > 400 ? label.x - 110 : label.x + 10;
        const ty = label.y > 400 ? label.y - 80 : label.y + 20;
        return (
          <g>
            <rect x={tx} y={ty} width={160} height={72} rx="6"
              fill="var(--surface-solid)" stroke="var(--line-strong)" strokeWidth="1" />
            <text x={tx + 10} y={ty + 18} fontFamily="var(--mono)" fontSize="11" fontWeight="700" fill="var(--ink)">
              {hovered} — {dept.nom}
            </text>
            <text x={tx + 10} y={ty + 34} fontFamily="var(--sans)" fontSize="10" fill="var(--d-1)">
              {'Macron T2 : ' + dept.macronT2.toFixed(1) + '%'}
            </text>
            <text x={tx + 10} y={ty + 48} fontFamily="var(--sans)" fontSize="10" fill="var(--d-2)">
              {'Le Pen T2 : ' + dept.lepEnT2.toFixed(1) + '%'}
            </text>
            <text x={tx + 10} y={ty + 62} fontFamily="var(--sans)" fontSize="10" fill="var(--ink-4)">
              {'Participation : ' + dept.part.toFixed(1) + '%'}
            </text>
          </g>
        );
      })()}
    </svg>
  );
}

function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">03 · Cartographie</span>
        <span className="chip">8 départements · 1 268 communes</span>
        <span className="chip">Présidentielle 2022 T2</span>
      </div>
      <h1 className="headline-1">L'Île-de-France, département par département.</h1>
      <p className="dek">
        Résultats du second tour 2022 par département IDF. Source : Ministère de l'Intérieur.
        Survolez un département pour voir les détails.
      </p>
    </section>
  );
}

function MapSection() {
  const [mode, setMode] = useState('vainqueur');

  const modeLabel = {
    vainqueur: 'Score Macron T2',
    participation: 'Participation T1',
    lepen: 'Score Le Pen T2',
  };

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Visualisation géographique</span>
          <h2>{modeLabel[mode]}</h2>
        </div>
        <div className="tabs">
          <button className={mode === 'vainqueur' ? 'active' : ''} onClick={() => setMode('vainqueur')}>
            Macron T2
          </button>
          <button className={mode === 'participation' ? 'active' : ''} onClick={() => setMode('participation')}>
            Participation
          </button>
          <button className={mode === 'lepen' ? 'active' : ''} onClick={() => setMode('lepen')}>
            Le Pen T2
          </button>
        </div>
      </div>

      <div className="grid-12" style={{ alignItems: 'start', gap: 32 }}>
        <div className="panel" style={{ padding: 24 }}>
          <DeptMap mode={mode} />
          <div style={{ display: 'flex', gap: 12, marginTop: 16, justifyContent: 'center', flexWrap: 'wrap' }}>
            {mode === 'vainqueur' && (
              <>
                <div style={{ height: 10, width: 180, borderRadius: 999, background: 'linear-gradient(90deg, color-mix(in srgb, var(--d-1) 20%, var(--surface-solid)), var(--d-1))' }} />
                <div style={{ display: 'flex', justifyContent: 'space-between', width: 180, fontSize: 11, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>
                  <span>55%</span><span>85%</span>
                </div>
              </>
            )}
            {mode === 'participation' && (
              <>
                <div style={{ height: 10, width: 180, borderRadius: 999, background: 'linear-gradient(90deg, color-mix(in srgb, var(--d-3) 15%, var(--surface-solid)), var(--d-3))' }} />
                <div style={{ display: 'flex', justifyContent: 'space-between', width: 180, fontSize: 11, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>
                  <span>60%</span><span>82%</span>
                </div>
              </>
            )}
            {mode === 'lepen' && (
              <>
                <div style={{ height: 10, width: 180, borderRadius: 999, background: 'linear-gradient(90deg, color-mix(in srgb, var(--d-2) 15%, var(--surface-solid)), var(--d-2))' }} />
                <div style={{ display: 'flex', justifyContent: 'space-between', width: 180, fontSize: 11, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>
                  <span>15%</span><span>43%</span>
                </div>
              </>
            )}
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div className="panel">
            <div className="panel-hd"><h3>Résultats T2 par département</h3></div>
            <div className="bar-list">
              {[...MOCK.depts].sort((a, b) => b.macronT2 - a.macronT2).map((d, i) => (
                <div key={d.code} className="bar-row">
                  <div className="rank" style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>{d.code}</div>
                  <div className="nm">{d.nom}<small>{d.communes} communes</small></div>
                  <div className="br">
                    <i style={{ width: (d.macronT2) + '%', background: 'var(--d-1)' }} />
                  </div>
                  <div className="pc tnum">{d.macronT2.toFixed(1)}<small>%</small></div>
                </div>
              ))}
            </div>
          </div>

          <div className="panel">
            <div className="panel-hd"><h3>Résultat global IDF — T2</h3></div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                <span style={{ color: 'var(--d-1)', fontWeight: 600 }}>Macron 64,18%</span>
                <span style={{ color: 'var(--d-2)', fontWeight: 600 }}>Le Pen 35,82%</span>
              </div>
              <div style={{ height: 14, borderRadius: 999, background: 'var(--bg-3)', overflow: 'hidden', display: 'flex' }}>
                <div style={{ width: '64.18%', background: 'var(--d-1)', height: '100%' }} />
                <div style={{ width: '35.82%', background: 'var(--d-2)', height: '100%' }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 11, color: 'var(--ink-4)' }}>
                <span>Marge Macron : +28,36 pts</span>
                <span>vs national : +17,1 pts</span>
              </div>
            </div>
            <div style={{ padding: '12px 0', borderTop: '1px solid var(--line)' }}>
              <div className="label" style={{ marginBottom: 8 }}>Participation T1 IDF</div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                <span style={{ fontSize: 28, fontWeight: 600, letterSpacing: '-0.025em' }}>73,6</span>
                <span style={{ color: 'var(--ink-4)' }}>%</span>
                <span style={{ fontSize: 12, color: 'var(--ink-4)' }}>· +2,1 pts vs national</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="map" />
      <main className="shell">
        <Header />
        <MapSection />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
