<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Réalité vs Prédictions — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
<style>
.cm-grid{display:grid;grid-template-columns:120px 1fr 1fr;gap:3px;font-size:13px}
.cm-cell{padding:18px 12px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bg-2);text-align:center}
.cm-cell.head{background:transparent;font-size:11px;color:var(--ink-4);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cm-cell .cm-count{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-0.03em}
.cm-cell .cm-label{font-size:11px;color:var(--ink-4)}
.cm-cell.tp{background:color-mix(in srgb,var(--status-ok) 14%,var(--surface-solid))}
.cm-cell.tn{background:color-mix(in srgb,var(--status-ok) 10%,var(--surface-solid))}
.cm-cell.fp{background:color-mix(in srgb,var(--status-err) 12%,var(--surface-solid))}
.cm-cell.fn{background:color-mix(in srgb,var(--status-err) 9%,var(--surface-solid))}
.model-tabs{display:flex;gap:6px;flex-wrap:wrap}
.model-tabs button{padding:7px 16px;font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:var(--r-sm);background:transparent;cursor:pointer;color:var(--ink-3);transition:background .15s,color .15s,border-color .15s}
.model-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.dept-tab-bar{display:flex;gap:4px;flex-wrap:wrap}
.dept-tab-bar button{padding:4px 10px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--line);border-radius:var(--r-sm);background:transparent;cursor:pointer;color:var(--ink-3);transition:background .15s,color .15s}
.dept-tab-bar button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle-group{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.toggle-group button{padding:6px 14px;font-size:12px;font-weight:500;background:transparent;border:none;cursor:pointer;color:var(--ink-3);transition:background .15s,color .15s}
.toggle-group button.active{background:var(--ink);color:#fff}
.cand-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.cand-bar-row:last-child{border-bottom:none}
.cand-name{font-size:12.5px;font-weight:500;width:88px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-party{font-size:10px;color:var(--ink-4);width:34px;flex-shrink:0;font-family:var(--mono)}
.cand-track{flex:1;height:9px;border-radius:4px;background:var(--bg-3);overflow:hidden;position:relative}
.cand-track i{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .4s ease}
.cand-pct{font-size:13px;font-weight:600;width:44px;text-align:right;font-family:var(--mono);flex-shrink:0}
.result-ok{color:var(--status-ok);font-weight:700;font-size:15px}
.result-err{color:var(--status-err);font-weight:700;font-size:15px}
.proba-bar{height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden;margin-top:3px}
.proba-bar i{display:block;height:100%;border-radius:2px}
.commune-search-input{width:100%;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-solid);color:var(--ink);outline:none;box-sizing:border-box}
.compare-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-radius:var(--r-sm);margin-bottom:16px;font-size:12px;color:var(--ink-4)}
.compare-header strong{color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const T1_CANDS = [
  { key: 't1_macron',    label: 'Macron',    party: 'LREM', color: 'var(--d-1)' },
  { key: 't1_melenchon', label: 'Mélenchon', party: 'LFI',  color: 'var(--d-3)' },
  { key: 't1_lepen',     label: 'Le Pen',    party: 'RN',   color: 'var(--d-2)' },
  { key: 't1_zemmour',   label: 'Zemmour',   party: 'REC',  color: 'var(--d-4)' },
  { key: 't1_pecresse',  label: 'Pécresse',  party: 'LR',   color: 'var(--d-5)' },
  { key: 't1_jadot',     label: 'Jadot',     party: 'EELV', color: 'var(--d-6)' },
  { key: 't1_autres',    label: 'Autres',    party: '',     color: 'var(--ink-4)' },
];
const DEPT_NAMES = {
  '75':'Paris','77':'Seine-et-Marne','78':'Yvelines','91':'Essonne',
  '92':'Hauts-de-Seine','93':'Seine-Saint-Denis','94':'Val-de-Marne','95':"Val-d'Oise",
};
const DEPT_ORDER = ['75','92','78','91','94','93','77','95'];

const mean = (rows, key) => {
  const vals = rows.map(r => r[key]).filter(v => v != null && !isNaN(v));
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
};

// ── Barre candidat ────────────────────────────────────────────────────────────
function CandBar({ label, party, val, color, max }) {
  const w = val != null ? Math.min(100, (val / (max || 1)) * 100) : 0;
  return (
    <div className="cand-bar-row">
      <span className="cand-name" style={{ color }}>{label}</span>
      <span className="cand-party">{party}</span>
      <div className="cand-track"><i style={{ width: w + '%', background: color }} /></div>
      <span className="cand-pct" style={{ color }}>{val != null ? val.toFixed(1) : '—'}%</span>
    </div>
  );
}

// ── Sélecteur de modèle ───────────────────────────────────────────────────────
function ModelSelector({ models, selected, onSelect }) {
  if (!models.length) return null;
  return (
    <div className="panel" style={{ padding: '14px 20px', marginBottom: 24 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Modèle actif</div>
          <div className="model-tabs">
            {models.map(m => (
              <button key={m.id} className={selected === m.id ? 'active' : ''} onClick={() => onSelect(m.id)}>
                {m.name}
              </button>
            ))}
          </div>
        </div>
        <div style={{ fontSize: 11, color: 'var(--ink-4)', lineHeight: 1.5, maxWidth: 260 }}>
          Prédictions chargées depuis les CSV ML (<code style={{ fontFamily:'var(--mono)', fontSize:10 }}>/artifacts/</code>).
          Toutes les 1 268 communes IDF.
        </div>
      </div>
    </div>
  );
}

// ── T1 — Côte à côte ─────────────────────────────────────────────────────────
function T1Section({ rows }) {
  // T1 data is valid only when at least one named candidate has a non-zero score.
  // If cible_t1_pct_* are all 0 (ETL extracted only one candidate), show a warning.
  const hasT1 = rows.some(r => r.t1_macron != null && r.t1_macron > 0);

  const csvCands = useMemo(() => {
    if (!hasT1) return [];
    return T1_CANDS.map(c => ({ ...c, val: mean(rows, c.key) }))
      .filter(c => c.val != null)
      .sort((a, b) => b.val - a.val);
  }, [rows, hasT1]);

  const officialCands = useMemo(() =>
    [...MOCK.candidatesT1]
      .map(c => {
        const short = c.name.split(' ').pop();
        return { label: short, party: c.party, color: c.color, val: c.value };
      })
      .sort((a, b) => b.val - a.val),
  []);

  const maxCsv = csvCands[0]?.val || 1;
  const maxOff = officialCands[0]?.val || 1;

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Tour 1 · 10 avril 2022</span>
          <h2>Résultats T1 par candidat</h2>
        </div>
        <p>Données communes (CSV pipeline) vs résultats officiels IDF agrégés</p>
      </div>
      <div className="grid-12">
        {/* Gauche : données CSV */}
        <div className="panel">
          <div className="compare-header">
            <span>📊</span>
            <span>
              <strong>Données communes</strong> — {rows.length.toLocaleString('fr-FR')} communes IDF
              (moyenne non pondérée par inscrits)
            </span>
          </div>
          {hasT1
            ? csvCands.map(c => <CandBar key={c.key} label={c.label} party={c.party} val={c.val} color={c.color} max={maxCsv} />)
            : (
              <div style={{ padding:'14px 0', fontSize:12.5, color:'var(--ink-4)', lineHeight:1.8 }}>
                ⚠️ Données T1 par candidat non disponibles dans le CSV.<br/>
                <span style={{ fontSize:11.5 }}>
                  Le fichier source 2022 T1 ne contenait qu'un seul candidat (ARTHAUD).<br/>
                  Supprimez <code style={{ fontFamily:'var(--mono)', fontSize:11 }}>candidats_results.csv</code> et relancez <code style={{ fontFamily:'var(--mono)', fontSize:11 }}>python run_all.py</code>.
                </span>
              </div>
            )}
        </div>
        {/* Droite : officiel IDF */}
        <div className="panel">
          <div className="compare-header">
            <span>🏛️</span>
            <span>
              <strong>Résultats officiels IDF 2022</strong> — source Ministère de l'Intérieur
              (pondéré par nombre d'inscrits)
            </span>
          </div>
          {officialCands.map(c => <CandBar key={c.label} label={c.label} party={c.party} val={c.val} color={c.color} max={maxOff} />)}
        </div>
      </div>
      <div style={{ marginTop: 12, padding: '10px 14px', background: 'var(--bg-2)', borderRadius: 6,
        fontSize: 11.5, color: 'var(--ink-3)', lineHeight: 1.6 }}>
        Les légères différences entre les deux colonnes reflètent l'effet de pondération :
        la moyenne par commune donne le même poids à une petite commune de 200 inscrits qu'à Paris (1,1M inscrits).
        Les résultats officiels sont pondérés par le nombre d'inscrits.
      </div>
    </section>
  );
}

// ── T2 — Prédiction seule ─────────────────────────────────────────────────────
function T2Section({ rows, modelName }) {
  const predM  = mean(rows, 'score_macron_predit');
  const predLP = predM != null ? 100 - predM : null;
  const realM  = MOCK.t2[0]?.value ?? 64.18;
  const MC = 'var(--d-1)', LP = 'var(--d-2)';
  const ecart  = predM != null ? (predM - realM) : null;

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Tour 2 · 24 avril 2022</span>
          <h2>Macron vs Le Pen — Prédiction T2</h2>
        </div>
        <p>Score prédit par le modèle ML · {modelName}</p>
      </div>
      <div className="panel">
        {predM != null ? (
          <>
            <div style={{ display:'flex', height:14, borderRadius:7, overflow:'hidden', marginBottom:20 }}>
              <div style={{ width: predM+'%', background: MC }} />
              <div style={{ width: (100-predM)+'%', background: LP }} />
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, marginBottom:16 }}>
              {[['Emmanuel Macron', predM, MC], ['Marine Le Pen', predLP, LP]].map(([n, v, c]) => (
                <div key={n} style={{ display:'flex', flexDirection:'column', gap:4 }}>
                  <span style={{ fontSize:12, color:c, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em' }}>{n}</span>
                  <span className="tnum" style={{ fontSize:36, fontWeight:700, color:c, lineHeight:1 }}>{v.toFixed(1)}<span style={{ fontSize:18 }}>%</span></span>
                </div>
              ))}
            </div>
            <div style={{ fontSize:11.5, color:'var(--ink-4)', lineHeight:1.6 }}>
              Moyenne du score prédit sur {rows.length.toLocaleString('fr-FR')} communes ·
              entraîné sur features socio-économiques INSEE + résultats T1 2022.
            </div>
          </>
        ) : (
          <div style={{ color:'var(--ink-4)', fontSize:13, padding:12 }}>
            Prédictions non disponibles pour ce modèle.
          </div>
        )}
      </div>
      {predM != null && predM > 90 && (
        <div style={{ marginTop:12, padding:'12px 16px', background:'color-mix(in srgb,var(--status-warn,#f59e0b) 12%,var(--surface-solid))',
          borderRadius:6, border:'1px solid color-mix(in srgb,var(--status-warn,#f59e0b) 30%,transparent)',
          fontSize:12, color:'var(--ink-2)', lineHeight:1.7 }}>
          ⚠️ <strong>Données T2 incomplètes dans le pipeline</strong> — le fichier source ne contenait qu'un seul candidat
          (MACRON), donc la cible d'entraînement vaut 100 % dans toutes les communes.
          Supprimez <code style={{ fontSize:11, margin:'0 4px', fontFamily:'var(--mono)' }}>candidats_results.csv</code>
          et relancez <code style={{ fontSize:11, margin:'0 4px', fontFamily:'var(--mono)' }}>python run_all.py</code>.
        </div>
      )}
      {ecart != null && predM <= 90 && (
        <div style={{ marginTop:12, padding:'12px 16px', background:'var(--bg-2)', borderRadius:6,
          fontSize:12, color:'var(--ink-3)', lineHeight:1.7, display:'flex', gap:24, flexWrap:'wrap' }}>
          <span>
            Écart modèle vs réalité (Macron) :
            <strong style={{ marginLeft:6, color: Math.abs(ecart) < 2 ? 'var(--status-ok)' : 'var(--ink)' }}>
              {ecart > 0 ? '+' : ''}{ecart.toFixed(1)} pts
            </strong>
          </span>
          <span>Score prédit : <strong>{predM.toFixed(1)}%</strong> · Score réel IDF : <strong>{realM.toFixed(2)}%</strong></span>
        </div>
      )}
    </section>
  );
}

// ── Participation & abstention ─────────────────────────────────────────────────
function ParticipationSection({ rows }) {
  const csvPart = mean(rows, 'participation_t1');
  const realPart = 73.6;
  const realAbst = 26.4;
  const csvAbst  = csvPart != null ? 100 - csvPart : null;
  const stats = [
    { lbl: 'Participation T1 IDF (officiel)',  val: realPart, note: 'Source Ministère de l\'Intérieur', color: 'var(--d-1)' },
    { lbl: 'Abstention T1 IDF (officiel)',     val: realAbst, note: 'IDF en dessous du national (28,7%)', color: 'var(--d-4)' },
    { lbl: 'Participation T1 (communes CSV)',   val: csvPart,  note: `Moyenne sur ${rows.length} communes`, color: 'var(--ink-3)' },
    { lbl: 'Abstention T1 (communes CSV)',      val: csvAbst,  note: 'Calculée depuis participation CSV', color: 'var(--ink-4)' },
  ];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Participation · Tour 1</span>
          <h2>Taux de participation et d'abstention</h2>
        </div>
        <p>Officiel IDF vs moyenne des communes du pipeline</p>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16 }}>
        {stats.map(s => (
          <div key={s.lbl} style={{ padding:'18px 20px', background:'var(--bg-2)', borderRadius:'var(--r)',
            border:'1px solid var(--line)' }}>
            <div className="label" style={{ fontSize:11 }}>{s.lbl}</div>
            <div style={{ display:'flex', alignItems:'baseline', gap:4, marginTop:8 }}>
              <span className="metric tnum" style={{ fontSize:28, color: s.color }}>
                {s.val != null ? s.val.toFixed(1) : '—'}
              </span>
              <span style={{ fontSize:14, color:'var(--ink-4)' }}>%</span>
            </div>
            <div style={{ fontSize:11, color:'var(--ink-5)', marginTop:6 }}>{s.note}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

// ── Performances du modèle ────────────────────────────────────────────────────
function ModelStats({ rows, modelName }) {
  const total   = rows.length;
  if (!total) return null;
  const correct = rows.filter(r => r.correct === 1).length;
  const wrong   = total - correct;
  const tp = rows.filter(r => r.ground_truth === 0 && r.prediction === 0).length;
  const tn = rows.filter(r => r.ground_truth === 1 && r.prediction === 1).length;
  const fp = rows.filter(r => r.ground_truth === 1 && r.prediction === 0).length;
  const fn = rows.filter(r => r.ground_truth === 0 && r.prediction === 1).length;
  const acc = correct / total;

  const byDept = {};
  rows.forEach(r => {
    const d = r.code_departement;
    if (!d) return;
    if (!byDept[d]) byDept[d] = { total: 0, correct: 0 };
    byDept[d].total++;
    if (r.correct === 1) byDept[d].correct++;
  });
  const depts = DEPT_ORDER.filter(d => byDept[d]).map(d => ({
    code: d, nom: DEPT_NAMES[d] || d,
    acc: byDept[d].correct / byDept[d].total,
    correct: byDept[d].correct, total: byDept[d].total,
  }));

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Performances — {modelName}</span>
          <h2>Précision vainqueur T2 — {total.toLocaleString('fr-FR')} communes</h2>
        </div>
        <span className="chip ok"><span className="dot" />{(acc*100).toFixed(1)}% accuracy globale</span>
      </div>

      {/* KPIs compacts */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14, marginBottom:24 }}>
        {[
          { lbl:'Accuracy', val:(acc*100).toFixed(1)+'%', note:`${correct}/${total} communes`, color:'var(--ink)' },
          { lbl:'Correctes', val:correct.toLocaleString('fr-FR'), note:'Vainqueur T2 prédit juste', color:'var(--status-ok)' },
          { lbl:'Erreurs', val:wrong.toLocaleString('fr-FR'), note:((wrong/total)*100).toFixed(1)+'% du total', color:'var(--status-err)' },
          { lbl:'Communes', val:total.toLocaleString('fr-FR'), note:'IDF — 8 départements', color:'var(--ink-3)' },
        ].map(k => (
          <div key={k.lbl} style={{ padding:'14px 16px', background:'var(--bg-2)', borderRadius:'var(--r)', border:'1px solid var(--line)' }}>
            <div className="label">{k.lbl}</div>
            <div className="metric tnum" style={{ fontSize:24, color:k.color, marginTop:4 }}>{k.val}</div>
            <div style={{ fontSize:11, color:'var(--ink-5)', marginTop:4 }}>{k.note}</div>
          </div>
        ))}
      </div>

      <div className="grid-12">
        {/* Matrice de confusion */}
        <div className="panel">
          <div className="eyebrow" style={{ marginBottom:12 }}>Matrice de confusion</div>
          <div className="cm-grid">
            <div className="cm-cell head" />
            <div className="cm-cell head">Prédit Macron</div>
            <div className="cm-cell head">Prédit Le Pen</div>
            <div className="cm-cell head" style={{ justifyContent:'flex-end', alignItems:'flex-start', padding:'12px 10px' }}>Réel Macron</div>
            <div className="cm-cell tp">
              <span className="cm-count" style={{ color:'var(--status-ok)' }}>{tp}</span>
              <span className="cm-label">Vrais positifs</span>
              <span className="cm-label">{((tp/total)*100).toFixed(1)}%</span>
            </div>
            <div className="cm-cell fn">
              <span className="cm-count" style={{ color:'var(--status-err)' }}>{fn}</span>
              <span className="cm-label">Faux négatifs</span>
              <span className="cm-label">{((fn/total)*100).toFixed(1)}%</span>
            </div>
            <div className="cm-cell head" style={{ justifyContent:'flex-end', alignItems:'flex-start', padding:'12px 10px' }}>Réel Le Pen</div>
            <div className="cm-cell fp">
              <span className="cm-count" style={{ color:'var(--status-err)' }}>{fp}</span>
              <span className="cm-label">Faux positifs</span>
              <span className="cm-label">{((fp/total)*100).toFixed(1)}%</span>
            </div>
            <div className="cm-cell tn">
              <span className="cm-count" style={{ color:'var(--status-ok)' }}>{tn}</span>
              <span className="cm-label">Vrais négatifs</span>
              <span className="cm-label">{((tn/total)*100).toFixed(1)}%</span>
            </div>
          </div>
          <div style={{ marginTop:12, fontSize:11.5, color:'var(--ink-4)', lineHeight:1.7 }}>
            Macron gagne {tp+fn} communes ({(((tp+fn)/total)*100).toFixed(1)}%) ·
            Le Pen gagne {fp+tn} communes ({(((fp+tn)/total)*100).toFixed(1)}%)
          </div>
        </div>
        {/* Accuracy par département */}
        <div className="panel">
          <div className="eyebrow" style={{ marginBottom:12 }}>Accuracy vainqueur par département</div>
          <div className="bar-list">
            {depts.map(d => {
              const col = d.acc >= 0.97 ? 'var(--status-ok)' : d.acc >= 0.88 ? 'var(--ink-3)' : 'var(--status-err)';
              return (
                <div key={d.code} className="bar-row">
                  <div className="rank" style={{ fontFamily:'var(--mono)', fontSize:11 }}>{d.code}</div>
                  <div className="nm">{d.nom}<small>{d.correct}/{d.total}</small></div>
                  <div className="br"><i style={{ width:(d.acc*100)+'%', background:col }} /></div>
                  <div className="pc tnum" style={{ color:col }}>{(d.acc*100).toFixed(1)}<small>%</small></div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </section>
  );
}

// ── Tableau communes ──────────────────────────────────────────────────────────
function CommuneTable({ rows }) {
  const [dept,   setDept]   = useState('Tous');
  const [filter, setFilter] = useState('tous');
  const [search, setSearch] = useState('');

  const allDepts = useMemo(() => DEPT_ORDER.filter(d => rows.some(r => r.code_departement === d)), [rows]);

  const filtered = useMemo(() => rows.filter(r => {
    if (dept !== 'Tous' && r.code_departement !== dept) return false;
    if (filter === 'correct' && r.correct !== 1) return false;
    if (filter === 'erreur'  && r.correct !== 0) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!r.libelle_commune?.toLowerCase().includes(q) && !r.code_commune?.includes(q)) return false;
    }
    return true;
  }), [rows, dept, filter, search]);

  const shown = filtered.slice(0, 300);
  const MC = 'var(--d-1)', LP = 'var(--d-2)';

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Détail par commune</span>
          <h2>{filtered.length.toLocaleString('fr-FR')} commune{filtered.length > 1 ? 's' : ''}</h2>
        </div>
      </div>
      <div style={{ display:'flex', gap:12, flexWrap:'wrap', alignItems:'center', marginBottom:16 }}>
        <div className="toggle-group">
          {[['tous','Toutes'],['correct','Correctes ✓'],['erreur','Erreurs ✗']].map(([v,l]) => (
            <button key={v} className={filter === v ? 'active' : ''} onClick={() => setFilter(v)}>{l}</button>
          ))}
        </div>
        <div className="dept-tab-bar">
          {['Tous', ...allDepts].map(d => (
            <button key={d} className={dept === d ? 'active' : ''} onClick={() => setDept(d)}>{d}</button>
          ))}
        </div>
        <input type="search" placeholder="Commune ou code INSEE…" value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ padding:'5px 12px', fontSize:12.5, border:'1px solid var(--line)',
            borderRadius:'var(--r-sm)', background:'var(--surface-solid)', color:'var(--ink)',
            outline:'none', minWidth:200, flex:1, maxWidth:320 }} />
      </div>
      <div className="panel" style={{ padding:0, overflow:'hidden' }}>
        <table className="tbl">
          <thead>
            <tr>
              <th>Code</th><th>Commune</th><th>Dept</th>
              <th>Vainqueur réel T2</th><th>Vainqueur prédit T2</th>
              <th className="num">Score prédit</th>
              <th className="num">Score réel</th>
              <th className="num">Proba Macron</th>
              <th style={{ textAlign:'center', width:72 }}>✓/✗</th>
            </tr>
          </thead>
          <tbody>
            {shown.map(r => {
              const rc = r.ground_truth === 0 ? MC : LP;
              const pc = r.prediction   === 0 ? MC : LP;
              return (
                <tr key={r.code_commune}
                  style={r.correct === 0 ? { background:'color-mix(in srgb,var(--status-err) 4%,transparent)' } : {}}>
                  <td className="mono" style={{ color:'var(--ink-4)', fontSize:11 }}>{r.code_commune}</td>
                  <td style={{ fontWeight:500 }}>{r.libelle_commune}</td>
                  <td className="mono" style={{ fontSize:12 }}>{r.code_departement}</td>
                  <td>
                    <span className="chip" style={{ color:rc, borderColor:'transparent',
                      background:`color-mix(in srgb,${rc} 10%,transparent)` }}>
                      <span className="dot" style={{ background:rc }} />{r.vainqueur_reel}
                    </span>
                  </td>
                  <td>
                    <span className="chip" style={{ color:pc, borderColor:'transparent',
                      background:`color-mix(in srgb,${pc} 10%,transparent)` }}>
                      <span className="dot" style={{ background:pc }} />{r.vainqueur_predit}
                    </span>
                  </td>
                  <td className="num tnum" style={{ color: MC, fontSize:12 }}>
                    {r.score_macron_predit != null ? r.score_macron_predit.toFixed(1)+'%' : '—'}
                  </td>
                  <td className="num tnum" style={{ fontSize:12 }}>
                    {r.ground_truth_pct != null ? r.ground_truth_pct.toFixed(1)+'%' : '—'}
                  </td>
                  <td className="num">
                    <div style={{ minWidth:64 }}>
                      <div className="tnum" style={{ fontSize:12, color:MC }}>{(r.proba_macron*100).toFixed(1)}%</div>
                      <div className="proba-bar"><i style={{ width:(r.proba_macron*100)+'%', background:MC }} /></div>
                    </div>
                  </td>
                  <td style={{ textAlign:'center' }}>
                    {r.correct === 1
                      ? <span className="result-ok">✓</span>
                      : <span className="result-err">✗</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {filtered.length > 300 && (
          <div style={{ padding:'10px 16px', fontSize:12, color:'var(--ink-4)', borderTop:'1px solid var(--line)', background:'var(--bg-2)' }}>
            {shown.length} sur {filtered.length.toLocaleString('fr-FR')} communes — affinez les filtres.
          </div>
        )}
        {filtered.length === 0 && (
          <div style={{ padding:40, textAlign:'center', color:'var(--ink-4)' }}>Aucune commune ne correspond.</div>
        )}
      </div>
    </section>
  );
}

// ── Header ────────────────────────────────────────────────────────────────────
function Header({ loaded, error }) {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">02 · Réalité vs Prédictions</span>
        <span className="chip">Île-de-France 2022</span>
        {loaded
          ? <span className="chip ok"><span className="live-dot" />Prédictions chargées — {(new Date()).toLocaleDateString('fr-FR')}</span>
          : error
          ? <span className="chip" style={{ color:'var(--status-err)' }}>Chargement échoué</span>
          : <span className="chip">Chargement…</span>}
      </div>
      <h1 className="headline-1">Résultats 2022 — comparaison prédictions vs réalité.</h1>
      <p className="dek">
        T1 par candidat, T2 Macron vs Le Pen, participation et abstention :
        résultats des modèles ML côte à côte avec les résultats officiels IDF.
        Détail consultable jusqu'à la commune.
      </p>
    </section>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [predictions,   setPredictions]   = useState(null);
  const [loadError,     setLoadError]     = useState(false);
  const [selectedModel, setSelectedModel] = useState('gb_post_t1');

  useEffect(() => {
    Promise.all([loadPredictions(), loadArtifacts()])
      .then(([preds]) => {
        if (!preds || Object.keys(preds).length === 0) { setLoadError(true); return; }
        setPredictions(preds);
        const first = ['gb_post_t1','gb_pre_vote','rf_post_t1','rf_pre_vote','dt_pre_vote','mlp_pre_vote']
          .find(id => preds[id]);
        if (first) setSelectedModel(first);
      })
      .catch(() => setLoadError(true));
  }, []);

  const modelList = predictions
    ? ['gb_post_t1','gb_pre_vote','rf_post_t1','rf_pre_vote','dt_pre_vote','mlp_pre_vote']
        .filter(id => predictions[id])
        .map(id => ({ id, name: predictions[id].name }))
    : [];

  const currentRows = predictions?.[selectedModel]?.rows ?? [];
  const currentName = predictions?.[selectedModel]?.name ?? '—';
  const loaded = !!predictions && !loadError;

  return (
    <>
      <Topbar active="comparison" />
      <main className="shell">
        <Header loaded={loaded} error={loadError} />

        {!loaded && !loadError && (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:320,
            color:'var(--ink-4)', fontSize:14, gap:12 }}>
            <div style={{ width:20, height:20, border:'2px solid var(--line)', borderTopColor:'var(--ink)',
              borderRadius:'50%', animation:'spin .8s linear infinite' }} />
            Chargement des prédictions ML depuis /artifacts/…
          </div>
        )}

        {loadError && (
          <div className="panel" style={{ textAlign:'center', color:'var(--status-err)', padding:40 }}>
            Impossible de charger les fichiers depuis /artifacts/.
            Vérifiez que Nginx sert correctement ce répertoire ou relancez <code>run_all.py</code>.
          </div>
        )}

        {loaded && (
          <>
            <ModelSelector models={modelList} selected={selectedModel} onSelect={setSelectedModel} />
            <T1Section rows={currentRows} />
            <T2Section rows={currentRows} modelName={currentName} />
            <ParticipationSection rows={currentRows} />
            <ModelStats rows={currentRows} modelName={currentName} />
            <CommuneTable rows={currentRows} />
          </>
        )}
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
