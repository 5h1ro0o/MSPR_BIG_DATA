<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Candidats &amp; partis — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
function Donut({ a, b, ca, cb, label }) {
  const r = 70, c = 2 * Math.PI * r, total = a + b;
  const sa = (a / total) * c;
  return (
    <svg viewBox="0 0 180 180" style={{width: 180, height: 180}}>
      <circle cx="90" cy="90" r={r} fill="none" stroke="var(--bg-3)" strokeWidth="20"/>
      <circle cx="90" cy="90" r={r} fill="none" stroke={ca} strokeWidth="20" strokeDasharray={sa+' '+c} transform="rotate(-90 90 90)" strokeLinecap="butt"/>
      <circle cx="90" cy="90" r={r} fill="none" stroke={cb} strokeWidth="20" strokeDasharray={(c-sa)+' '+c} strokeDashoffset={-sa} transform="rotate(-90 90 90)" strokeLinecap="butt"/>
      <text x="90" y="92" textAnchor="middle" fontFamily="var(--sans)" fontSize="22" fontWeight="500" letterSpacing="-0.025em" fill="var(--ink)">{a.toFixed(1)}%</text>
      <text x="90" y="108" textAnchor="middle" fontFamily="var(--sans)" fontSize="10.5" fill="var(--ink-4)" letterSpacing="0.04em">{label}</text>
    </svg>
  );
}

function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">02 \u00b7 Candidats &amp; partis</span>
      </div>
      <h1 className="headline-1">Comparer un candidat \u00e0 l&apos;autre.</h1>
      <p className="dek">Vue tri\u00e9e par score, profil socio-\u00e9conomique de l&apos;\u00e9lectorat, terrain g\u00e9ographique, dynamique entre les tours.</p>
    </section>
  );
}

function Versus() {
  const left  = MOCK.candidatesT1[0];
  const right = MOCK.candidatesT1[1];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Face \u00e0 face</span>
          <h2>{left.name} vs {right.name}</h2>
        </div>
        <p>Comparaison des deux candidats arriv\u00e9s en t\u00eate au T1 en \u00cele-de-France.</p>
      </div>
      <div className="panel" style={{padding: 32}}>
        <div style={{display:'grid', gridTemplateColumns:'1fr auto 1fr', gap: 32, alignItems:'center'}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize: 28, fontWeight: 500, letterSpacing:'-0.025em'}}>{left.name}</div>
            <div style={{color:'var(--ink-4)', marginTop: 4}}>{left.party}</div>
            <div style={{display:'flex', gap: 8, justifyContent:'flex-end', marginTop: 14, flexWrap:'wrap'}}>
              <span className="chip">35.42% T1</span>
              <span className="chip">64.18% T2</span>
              <span className="chip">+ Paris &amp; 92</span>
            </div>
          </div>
          <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap: 4}}>
            <Donut a={left.value} b={right.value} ca={left.color} cb={right.color} label="T1 IDF"/>
            <span style={{fontFamily:'var(--mono)', fontSize: 11, color:'var(--ink-4)', marginTop: 4}}>VS</span>
          </div>
          <div>
            <div style={{fontSize: 28, fontWeight: 500, letterSpacing:'-0.025em'}}>{right.name}</div>
            <div style={{color:'var(--ink-4)', marginTop: 4}}>{right.party}</div>
            <div style={{display:'flex', gap: 8, marginTop: 14, flexWrap:'wrap'}}>
              <span className="chip">30.21% T1</span>
              <span className="chip">\u2014 T2</span>
              <span className="chip">+ 93 &amp; 95</span>
            </div>
          </div>
        </div>
        <hr style={{margin: '32px 0'}}/>
        <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 24}}>
          {[
            { lbl: 'Cadres',       a: 28,    b: 14,    u:'%' },
            { lbl: 'Ouvriers',     a:  9,    b: 21,    u:'%' },
            { lbl: 'Dipl. sup',    a: 41,    b: 24,    u:'%' },
            { lbl: 'Revenu m\u00e9dian', a: 28200, b: 19400, u:'\u20ac' },
          ].map(s => (
            <div key={s.lbl}>
              <div className="label" style={{marginBottom: 6}}>{s.lbl}</div>
              <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between'}}>
                <div>
                  <span className="metric tnum" style={{fontSize: 22}}>{s.a.toLocaleString('fr-FR')}</span>
                  <span style={{color:'var(--ink-4)', fontSize: 13}}>{s.u}</span>
                </div>
                <div style={{color:'var(--ink-4)', fontSize: 12}}>vs</div>
                <div>
                  <span className="metric tnum" style={{fontSize: 22}}>{s.b.toLocaleString('fr-FR')}</span>
                  <span style={{color:'var(--ink-4)', fontSize: 13}}>{s.u}</span>
                </div>
              </div>
              <div className="stack" style={{marginTop: 10, height: 6}}>
                <div className="seg" style={{width: ((s.a/(s.a+s.b))*100)+'%', background: left.color}}/>
                <div className="seg" style={{width: ((s.b/(s.a+s.b))*100)+'%', background: right.color}}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function FullList() {
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Classement complet</span>
          <h2>Tous les candidats du T1</h2>
        </div>
        <div className="tabs">
          <button className="active">Score (%)</button>
          <button>Voix</button>
          <button>Communes en t\u00eate</button>
        </div>
      </div>
      <div className="panel">
        <BarList rows={MOCK.candidatesT1} />
      </div>
    </section>
  );
}

function CommuneTable() {
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Terrain</span>
          <h2>Communes phares</h2>
        </div>
        <select style={{padding:'8px 12px', borderRadius:'var(--r-sm)', border:'1px solid var(--line-strong)', fontSize: 12.5, fontFamily:'var(--sans)', color:'var(--ink)', background:'var(--surface-solid)'}}>
          <option>Tous d\u00e9partements</option>
          <option>Paris (75)</option>
          <option>Hauts-de-Seine (92)</option>
          <option>Seine-Saint-Denis (93)</option>
          <option>Val-de-Marne (94)</option>
        </select>
      </div>
      <div className="panel" style={{padding: 0, overflow:'hidden'}}>
        <table className="tbl">
          <thead>
            <tr>
              <th>Code</th><th>Commune</th><th>D\u00e9pt.</th>
              <th className="num">Inscrits</th>
              <th className="num">Participation</th>
              <th>Vainqueur T1</th>
              <th className="num">Score (%)</th>
            </tr>
          </thead>
          <tbody>
            {MOCK.communes.map(c => (
              <tr key={c.code}>
                <td className="mono" style={{color:'var(--ink-4)'}}>{c.code}</td>
                <td style={{fontWeight: 500}}>{c.nom}</td>
                <td className="mono">{c.dept}</td>
                <td className="num tnum">{c.inscrits.toLocaleString('fr-FR')}</td>
                <td className="num tnum">{c.participation.toFixed(1)}%</td>
                <td>
                  <span className="chip" style={{background:'color-mix(in srgb, '+(MOCK.partyColor[c.top]||'var(--ink)')+' 10%, transparent)', borderColor:'transparent', color: MOCK.partyColor[c.top]||'var(--ink)'}}>
                    <span className="dot" style={{background: MOCK.partyColor[c.top]||'var(--ink)'}}></span>{c.top}
                  </span>
                </td>
                <td className="num tnum">{c.pct.toFixed(1)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="comparison" />
      <main className="shell">
        <Header />
        <Versus />
        <FullList />
        <CommuneTable />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
