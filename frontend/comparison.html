<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Candidats &amp; partis — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState } = React;

function Donut({ a, b, ca, cb, label }) {
  const r = 68, circ = 2 * Math.PI * r, total = a + b;
  const sa = (a / total) * circ;
  return (
    <svg viewBox="0 0 180 180" style={{ width: 180, height: 180 }}>
      <circle cx="90" cy="90" r={r} fill="none" stroke="var(--bg-3)" strokeWidth="22" />
      <circle cx="90" cy="90" r={r} fill="none" stroke={ca} strokeWidth="22"
        strokeDasharray={sa + ' ' + circ} transform="rotate(-90 90 90)" />
      <circle cx="90" cy="90" r={r} fill="none" stroke={cb} strokeWidth="22"
        strokeDasharray={(circ - sa) + ' ' + circ} strokeDashoffset={-sa} transform="rotate(-90 90 90)" />
      <text x="90" y="88" textAnchor="middle" fontFamily="var(--sans)" fontSize="24"
        fontWeight="600" letterSpacing="-0.03em" fill="var(--ink)">{a.toFixed(1)}%</text>
      <text x="90" y="105" textAnchor="middle" fontFamily="var(--sans)" fontSize="10"
        fill="var(--ink-4)" letterSpacing="0.04em">{label}</text>
    </svg>
  );
}

function Header() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">02 · Candidats &amp; partis</span>
        <span className="chip">Premier tour IDF · 10 avril 2022</span>
        <span className="chip">10 candidats</span>
      </div>
      <h1 className="headline-1">Les résultats candidat par candidat.</h1>
      <p className="dek">
        Classement du premier tour en Île-de-France, comparaison socio-économique des électorats,
        et résultat du second tour Macron vs Le Pen. Source : Ministère de l'Intérieur.
      </p>
    </section>
  );
}

function T1Ranking() {
  const total = MOCK.candidatesT1.reduce((s, c) => s + c.value, 0);
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Premier tour</span>
          <h2>Classement complet — IDF 2022</h2>
        </div>
        <span className="chip">Exprimés IDF · {total.toFixed(1)}% total</span>
      </div>
      <div className="grid-12">
        <div className="panel">
          <BarList rows={MOCK.candidatesT1} />
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid var(--line)' }}>
            <div className="label" style={{ marginBottom: 10 }}>Répartition graphique</div>
            <div style={{ display: 'flex', height: 20, borderRadius: 4, overflow: 'hidden', gap: 1 }}>
              {MOCK.candidatesT1.map((c, i) => (
                <div key={i} title={c.name + ' ' + c.value + '%'}
                  style={{ width: c.value + '%', background: c.color, minWidth: 2 }} />
              ))}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px 14px', marginTop: 10 }}>
              {MOCK.candidatesT1.slice(0, 6).map((c, i) => (
                <span key={i} style={{ fontSize: 11, color: 'var(--ink-3)', display: 'flex', alignItems: 'center', gap: 4 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, display: 'inline-block' }} />
                  {c.name.split(' ').pop()}
                </span>
              ))}
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div className="panel">
            <div className="panel-hd">
              <h3>Second tour</h3>
              <span className="chip">24 avril 2022</span>
            </div>
            <BarList rows={MOCK.t2} max={100} />
            <div style={{ marginTop: 20 }}>
              <StackBar segments={MOCK.t2} />
            </div>
            <div style={{ marginTop: 16, padding: '12px 14px', background: 'var(--bg-2)', borderRadius: 6, fontSize: 13, color: 'var(--ink-3)', lineHeight: 1.5 }}>
              Macron remporte l'IDF avec <strong style={{ color: 'var(--d-1)' }}>+28,4 points</strong> d'avance,
              soit un score nettement supérieur au résultat national (+17,1 pts).
              Paris (75) et les Hauts-de-Seine (92) constituent ses bastions.
            </div>
          </div>

          <div className="panel">
            <div className="panel-hd"><h3>Macron vs Mélenchon — T1</h3></div>
            <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 24, padding: '8px 0' }}>
              <Donut
                a={MOCK.candidatesT1[0].value}
                b={MOCK.candidatesT1[1].value}
                ca={MOCK.candidatesT1[0].color}
                cb={MOCK.candidatesT1[1].color}
                label="T1 IDF"
              />
              <div style={{ fontSize: 13, color: 'var(--ink-3)' }}>
                <div style={{ marginBottom: 8 }}>
                  <span style={{ color: 'var(--d-1)', fontWeight: 600 }}>Macron 35,42%</span>
                  <div style={{ fontSize: 12, color: 'var(--ink-4)' }}>+5,21 pts sur Mélenchon</div>
                </div>
                <div>
                  <span style={{ color: 'var(--d-3)', fontWeight: 600 }}>Mélenchon 30,21%</span>
                  <div style={{ fontSize: 12, color: 'var(--ink-4)' }}>Score LFI record en IDF</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function ElectoratProfiles() {
  const profiles = [
    { label: 'Macron (LREM)', color: 'var(--d-1)',
      cadres: 38, ouvriers: 8,  diplSup: 52, hlm: 12, revenu: 31200 },
    { label: 'Mélenchon (LFI)', color: 'var(--d-3)',
      cadres: 18, ouvriers: 22, diplSup: 31, hlm: 28, revenu: 21400 },
    { label: 'Le Pen (RN)',   color: 'var(--d-2)',
      cadres: 11, ouvriers: 28, diplSup: 18, hlm: 34, revenu: 18900 },
    { label: 'Pécresse (LR)', color: 'var(--d-5)',
      cadres: 42, ouvriers: 6,  diplSup: 55, hlm:  9, revenu: 34500 },
  ];

  const indicators = [
    { key: 'cadres',   label: '% cadres',         unit: '%', max: 60 },
    { key: 'ouvriers', label: '% ouvriers',        unit: '%', max: 40 },
    { key: 'diplSup',  label: '% diplômés Bac+3',  unit: '%', max: 70 },
    { key: 'hlm',      label: '% logements HLM',   unit: '%', max: 50 },
    { key: 'revenu',   label: 'Revenu médian',      unit: '€', max: 40000, fmt: v => v.toLocaleString('fr-FR') },
  ];

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Sociologie électorale</span>
          <h2>Profil socio-économique des électorats</h2>
        </div>
        <p>Caractéristiques moyennes des communes remportées par chaque candidat au T1 — IDF 2022.</p>
      </div>
      <div className="panel">
        <div style={{ display: 'grid', gridTemplateColumns: 'auto repeat(4, 1fr)', gap: '0 16px' }}>
          <div />
          {profiles.map(p => (
            <div key={p.label} style={{ textAlign: 'center', padding: '0 4px 16px', borderBottom: '2px solid ' + p.color }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: p.color }}>{p.label}</div>
            </div>
          ))}
          {indicators.map(ind => (
            <React.Fragment key={ind.key}>
              <div style={{ fontSize: 12, color: 'var(--ink-4)', padding: '10px 12px 10px 0',
                borderBottom: '1px solid var(--line-soft)', whiteSpace: 'nowrap' }}>
                {ind.label}
              </div>
              {profiles.map(p => {
                const val = p[ind.key];
                const pct = (val / ind.max) * 100;
                const fmt = ind.fmt ? ind.fmt(val) : val;
                return (
                  <div key={p.label} style={{ padding: '10px 4px', borderBottom: '1px solid var(--line-soft)' }}>
                    <div style={{ fontSize: 13, fontWeight: 500, textAlign: 'center', marginBottom: 4 }}>
                      {fmt}{ind.unit !== '€' ? ind.unit : ''}
                      {ind.unit === '€' && <span style={{ fontSize: 11, color: 'var(--ink-4)' }}>€</span>}
                    </div>
                    <div style={{ height: 4, borderRadius: 2, background: 'var(--bg-3)', overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: Math.min(100, pct) + '%', background: p.color }} />
                    </div>
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
        <div style={{ marginTop: 16, fontSize: 12, color: 'var(--ink-4)', borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          Source : croisement résultats électoraux × données INSEE RP 2022 et Filosofi 2017 sur les 1 268 communes IDF.
          Valeurs moyennes pondérées par le score du candidat.
        </div>
      </div>
    </section>
  );
}

function CommuneTable() {
  const [dept, setDept] = useState('Tous');
  const depts = ['Tous', '75', '77', '78', '91', '92', '93', '94', '95'];
  const filtered = dept === 'Tous' ? MOCK.communes : MOCK.communes.filter(c => c.dept === dept);
  const colorMap = { Macron: 'var(--d-1)', Melenchon: 'var(--d-3)', LePen: 'var(--d-2)' };

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Communes emblématiques</span>
          <h2>Résultats T1 sélection IDF</h2>
        </div>
        <div className="tabs">
          {depts.map(d => (
            <button key={d} className={dept === d ? 'active' : ''} onClick={() => setDept(d)}>{d}</button>
          ))}
        </div>
      </div>
      <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="tbl">
          <thead>
            <tr>
              <th>Code</th>
              <th>Commune</th>
              <th>Dept.</th>
              <th className="num">Inscrits</th>
              <th className="num">Participation</th>
              <th>Leader T1</th>
              <th className="num">Score (%)</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(c => {
              const col = colorMap[c.top] || 'var(--ink)';
              return (
                <tr key={c.code}>
                  <td className="mono" style={{ color: 'var(--ink-4)' }}>{c.code}</td>
                  <td style={{ fontWeight: 500 }}>{c.nom}</td>
                  <td className="mono">{c.dept}</td>
                  <td className="num tnum">{c.inscrits.toLocaleString('fr-FR')}</td>
                  <td className="num tnum">{c.participation.toFixed(1)}%</td>
                  <td>
                    <span className="chip" style={{ color: col, borderColor: 'transparent',
                      background: 'color-mix(in srgb, ' + col + ' 10%, transparent)' }}>
                      <span className="dot" style={{ background: col }} />
                      {c.top}
                    </span>
                  </td>
                  <td className="num tnum">{c.pct.toFixed(1)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="comparison" />
      <main className="shell">
        <Header />
        <T1Ranking />
        <ElectoratProfiles />
        <CommuneTable />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
