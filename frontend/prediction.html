<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Modèles ML — Electoral Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const pct = v => v != null ? (v * 100).toFixed(1) + '%' : '—';
const num = (v, d=3) => v != null ? v.toFixed(d) : '—';

function Header({ loaded }) {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="eyebrow">05 · Modèles ML</span>
        <span className="chip">Île-de-France 2022</span>
        {loaded
          ? <span className="chip ok"><span className="live-dot" />Métriques réelles chargées</span>
          : <span className="chip">Métriques du run 07/05/2026</span>}
      </div>
      <h1 className="headline-1">Prédire le vainqueur du T2, commune par commune.</h1>
      <p className="dek">
        4 configurations entraînées sur les profils socio-économiques et l'historique électoral 2012/2017.
        Cible : <code style={{ background: 'var(--bg-2)', padding: '2px 6px', borderRadius: 4, fontSize: 12 }}>cible_t2_vainqueur</code>
        — Macron (0) ou Le Pen (1). Split train/test 80/20 stratifié. CV 5 folds.
      </p>
    </section>
  );
}

function ModelTable({ models }) {
  const best = models.reduce((b, m) => (!b || (m.accuracy || 0) > (b.accuracy || 0)) ? m : b, null);
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Comparaison</span>
          <h2>Performances sur set de test (20 % — 254 communes)</h2>
        </div>
        <p>Test set : Macron gagne 171 communes (67,3 %) — Le Pen gagne 83 communes (32,7 %)</p>
      </div>
      <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="tbl">
          <thead>
            <tr>
              <th>Modèle</th>
              <th className="num">Accuracy</th>
              <th className="num">F1 pondéré</th>
              <th className="num">ROC-AUC</th>
              <th className="num">CV AUC (μ±σ)</th>
              <th className="num">Features</th>
              <th className="num">Temps</th>
              <th style={{ width: 120 }}></th>
            </tr>
          </thead>
          <tbody>
            {models.map(m => {
              const isBest = m === best;
              return (
                <tr key={m.name}
                  style={isBest ? { background: 'color-mix(in srgb, var(--ink) 3%, transparent)' } : {}}>
                  <td style={{ fontWeight: isBest ? 600 : 400 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {isBest && <span className="chip ok" style={{ padding: '2px 7px', fontSize: 10 }}><span className="dot" />retenu</span>}
                      {m.name}
                    </div>
                  </td>
                  <td className="num tnum" style={{ fontWeight: isBest ? 600 : 400 }}>{pct(m.accuracy)}</td>
                  <td className="num tnum">{pct(m.f1)}</td>
                  <td className="num tnum">{num(m.auc)}</td>
                  <td className="num tnum mono" style={{ fontSize: 11 }}>
                    {m.cv_auc != null ? num(m.cv_auc) : '—'}
                    {m.cv_std != null && <span style={{ color: 'var(--ink-4)' }}>±{num(m.cv_std, 4)}</span>}
                  </td>
                  <td className="num tnum">{m.feat || '—'}</td>
                  <td className="num mono">{m.time || '—'}</td>
                  <td>
                    <div style={{ height: 6, borderRadius: 999, background: 'var(--bg-3)', overflow: 'hidden' }}>
                      <div style={{
                        height: '100%',
                        width: pct(m.accuracy),
                        background: isBest ? 'var(--ink)' : 'var(--ink-4)',
                      }} />
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ marginTop: 16, padding: '12px 16px', background: 'var(--bg-2)', borderRadius: 6,
        fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.6 }}>
        <strong>Modèle retenu :</strong> Gradient Boosting post-T1 — accuracy <strong>95,67%</strong>,
        AUC-ROC <strong>0,985</strong>. Le feature set "post-T1" inclut les résultats du premier tour
        en plus des indicateurs socio-économiques, ce qui explique la performance supérieure.
        La variante "pré-vote" (sans T1) atteint 90,9 % et est utilisable pour une projection
        <em> avant</em> la tenue du scrutin.
      </div>
    </section>
  );
}

function FeatureImportance({ features }) {
  if (!features || features.length === 0) return null;
  const top = features.slice(0, 15);
  const max = Math.max(...top.map(t => t.imp));
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Interprétabilité</span>
          <h2>Top {top.length} variables explicatives — Gradient Boosting post-T1</h2>
        </div>
        <span className="chip ok"><span className="live-dot" />Chargées depuis gb_top_features.csv</span>
      </div>
      <div className="panel">
        <div className="bar-list">
          {top.map((t, i) => (
            <div key={t.name} className="bar-row">
              <div className="rank">{String(i + 1).padStart(2, '0')}</div>
              <div className="nm" style={{ fontFamily: 'var(--mono)', fontSize: 11.5 }}>
                {t.name}
                <small style={{ fontFamily: 'var(--sans)' }}>{t.desc}</small>
              </div>
              <div className="br"><i style={{ width: ((t.imp / max) * 100) + '%', background: 'var(--ink)' }} /></div>
              <div className="pc tnum">{(t.imp * 100).toFixed(1)}<small>%</small></div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 16, fontSize: 12, color: 'var(--ink-4)', borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          La variable <code style={{ background: 'var(--bg-2)', padding: '1px 4px', borderRadius: 3 }}>{top[0]?.name}</code>
          {' '}({top[0]?.desc}) est la plus prédictive du vainqueur T2.
          Les scores historiques 2017 et 2022-T1 dominent le classement, confirmant la stabilité des comportements électoraux.
        </div>
      </div>
    </section>
  );
}

function Artifacts({ images }) {
  if (!images) return null;
  const charts = [
    { src: images.gb_results,    title: 'Gradient Boosting — analyse complète (importance · confusion · ROC)' },
    { src: images.rf_confusion,  title: 'Random Forest — matrice de confusion' },
    { src: images.rf_roc,        title: 'Random Forest — courbe ROC' },
    { src: images.gb_confusion,  title: 'Gradient Boosting — matrice de confusion' },
    { src: images.gb_roc,        title: 'Gradient Boosting — courbe ROC' },
    { src: images.gb_importance, title: 'Gradient Boosting — importance des features' },
  ];
  return (
    <section className="section">
      <div className="section-head">
        <div><span className="eyebrow">Visualisations</span><h2>Graphiques générés par le pipeline</h2></div>
        <span className="chip ok"><span className="live-dot" />Chargés depuis /artifacts/</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
        {charts.map(c => (
          <div key={c.src} className="panel" style={{ padding: 0, overflow: 'hidden' }}>
            <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--line)', fontSize: 12, color: 'var(--ink-3)' }}>
              {c.title}
            </div>
            <img src={c.src} alt={c.title}
              style={{ width: '100%', display: 'block', background: 'var(--bg-1)' }}
              onError={e => { e.target.parentNode.style.display = 'none'; }} />
          </div>
        ))}
      </div>
    </section>
  );
}

function CommuneLookup({ predictions }) {
  const [search, setSearch]           = useState('');
  const [selectedModel, setModelKey]  = useState('gb_post_t1');
  const [result, setResult]           = useState(null);
  const [suggestions, setSuggestions] = useState([]);

  const modelList = predictions
    ? ['gb_post_t1','gb_pre_vote','rf_post_t1','lstm'].filter(id => predictions[id])
    : [];

  const modelNames = {
    gb_post_t1:  'GB post-T1',
    gb_pre_vote: 'GB pré-vote',
    rf_post_t1:  'RF post-T1',
    lstm:        'LSTM',
  };

  const allRows = predictions?.[selectedModel]?.rows ?? [];

  const handleSearch = (q) => {
    setSearch(q);
    setResult(null);
    if (q.length < 2) { setSuggestions([]); return; }
    const lower = q.toLowerCase();
    const hits = allRows.filter(r =>
      r.libelle_commune.toLowerCase().includes(lower) || r.code_commune.startsWith(q)
    ).slice(0, 8);
    setSuggestions(hits);
  };

  const pick = (row) => {
    setResult(row);
    setSearch(row.libelle_commune);
    setSuggestions([]);
  };

  const macronColor = 'var(--d-1)';
  const lepenColor  = 'var(--d-2)';
  const realCol  = result ? (result.ground_truth === 0 ? macronColor : lepenColor) : null;
  const predCol  = result ? (result.prediction   === 0 ? macronColor : lepenColor) : null;

  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Exploration</span>
          <h2>Chercher une commune — prédiction du modèle</h2>
        </div>
        <p>
          Retrouvez la prédiction du modèle pour n'importe quelle commune IDF.
          Les valeurs affichées proviennent directement du fichier CSV généré lors de l'entraînement.
        </p>
      </div>
      <div className="grid-21">
        <div className="panel" style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div>
            <div className="label" style={{ marginBottom: 8 }}>Modèle</div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {modelList.map(id => (
                <button key={id}
                  onClick={() => { setModelKey(id); setResult(null); setSuggestions([]); }}
                  style={{
                    padding: '5px 12px', fontSize: 12, fontWeight: 500,
                    border: '1px solid var(--line)', borderRadius: 'var(--r-sm)',
                    background: selectedModel === id ? 'var(--ink)' : 'transparent',
                    color: selectedModel === id ? '#fff' : 'var(--ink-3)', cursor: 'pointer',
                  }}>
                  {modelNames[id] || id}
                </button>
              ))}
            </div>
          </div>
          <div style={{ position: 'relative' }}>
            <div className="label" style={{ marginBottom: 8 }}>Commune</div>
            <input
              type="search"
              placeholder="Nom de commune ou code INSEE…"
              value={search}
              onChange={e => handleSearch(e.target.value)}
              style={{
                width: '100%', padding: '9px 12px', fontSize: 13.5,
                border: '1px solid var(--line)', borderRadius: 'var(--r-sm)',
                background: 'var(--surface-solid)', color: 'var(--ink)', outline: 'none',
                boxSizing: 'border-box',
              }}
            />
            {suggestions.length > 0 && (
              <div style={{
                position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 10,
                background: 'var(--surface-solid)', border: '1px solid var(--line)',
                borderRadius: 'var(--r-sm)', boxShadow: '0 4px 16px rgba(0,0,0,.08)',
                marginTop: 4,
              }}>
                {suggestions.map(r => (
                  <div key={r.code_commune}
                    onClick={() => pick(r)}
                    style={{
                      padding: '9px 14px', cursor: 'pointer', fontSize: 13,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      borderBottom: '1px solid var(--line-soft)',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-2)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                    <span style={{ fontWeight: 500 }}>{r.libelle_commune}</span>
                    <span style={{ fontSize: 11, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>
                      {r.code_commune} · {r.code_departement}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
          {!result && (
            <div style={{ fontSize: 12, color: 'var(--ink-4)', lineHeight: 1.6 }}>
              Tapez au moins 2 caractères pour voir les suggestions.
              Les prédictions couvrent les {allRows.length.toLocaleString('fr-FR')} communes IDF.
            </div>
          )}
        </div>

        <div className="panel" style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {!result && (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
              flex: 1, color: 'var(--ink-5)', fontSize: 13, minHeight: 180 }}>
              Sélectionnez une commune pour voir la prédiction du modèle.
            </div>
          )}
          {result && (
            <>
              <div className="panel-hd">
                <div>
                  <h3 style={{ margin: 0 }}>{result.libelle_commune}</h3>
                  <div style={{ fontSize: 12, color: 'var(--ink-4)', marginTop: 2 }}>
                    {result.libelle_departement} · {result.code_commune} · {modelNames[selectedModel] || selectedModel}
                  </div>
                </div>
                {result.correct === 1
                  ? <span className="chip ok" style={{ fontSize: 11 }}><span className="dot" />Correct</span>
                  : <span className="chip" style={{ fontSize: 11, color: 'var(--status-err)', borderColor: 'var(--status-err)' }}>Erreur</span>}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div style={{ padding: 16, borderRadius: 'var(--r)', background: 'color-mix(in srgb, ' + realCol + ' 8%, var(--bg-2))' }}>
                  <div className="label" style={{ marginBottom: 6 }}>Vainqueur réel (T2)</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: realCol }}>{result.vainqueur_reel}</div>
                  <div style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 4 }}>Source : Min. Intérieur</div>
                </div>
                <div style={{ padding: 16, borderRadius: 'var(--r)', background: 'color-mix(in srgb, ' + predCol + ' 8%, var(--bg-2))' }}>
                  <div className="label" style={{ marginBottom: 6 }}>Prédit par le modèle</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: predCol }}>{result.vainqueur_predit}</div>
                  <div style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 4 }}>
                    {modelNames[selectedModel]}
                  </div>
                </div>
              </div>

              <div>
                <div className="label" style={{ marginBottom: 8 }}>Probabilités du modèle</div>
                <div style={{ display: 'flex', height: 14, borderRadius: 7, overflow: 'hidden' }}>
                  <div style={{ width: (result.proba_macron * 100) + '%', background: macronColor }} />
                  <div style={{ width: (result.proba_lepen  * 100) + '%', background: lepenColor  }} />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 12 }}>
                  <span style={{ color: macronColor, fontWeight: 600 }}>
                    Macron {(result.proba_macron * 100).toFixed(1)}%
                  </span>
                  <span style={{ color: lepenColor, fontWeight: 600 }}>
                    Le Pen {(result.proba_lepen * 100).toFixed(1)}%
                  </span>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

function App() {
  const [models,      setModels]      = useState(MOCK.models);
  const [features,    setFeatures]    = useState(MOCK.topFeatures);
  const [images,      setImages]      = useState(null);
  const [predictions, setPredictions] = useState(null);
  const [loaded,      setLoaded]      = useState(false);

  useEffect(() => {
    Promise.all([loadArtifacts(), loadPredictions()]).then(([, preds]) => {
      setModels([...MOCK.models]);
      setFeatures([...MOCK.topFeatures]);
      setImages(MOCK.images || null);
      setLoaded(!!MOCK.artifactsLoaded);
      if (Object.keys(preds).length > 0) setPredictions(preds);
    });
  }, []);

  return (
    <>
      <Topbar active="prediction" />
      <main className="shell">
        <Header loaded={loaded} />
        <ModelTable models={models} />
        <FeatureImportance features={features} />
        {images && <Artifacts images={images} />}
        <CommuneLookup predictions={predictions} />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
