<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Electoral Observatory — IDF 2022</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="components/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function Hero() {
  return (
    <section className="page-header">
      <div className="meta-row">
        <span className="chip"><span className="dot"></span>Présidentielle 2022 · Île-de-France</span>
        <span className="chip">1 268 communes</span>
        <span className="chip">113 features</span>
        <span className="chip"><span className="live-dot" style={{ width: 6, height: 6 }}></span>Pipeline actif</span>
      </div>
      <h1 className="headline-1">
        Une analyse <em style={{ fontStyle: 'italic', fontWeight: 400, color: 'var(--ink-3)' }}>granulaire</em> de l'élection présidentielle française, commune par commune.
      </h1>
      <p className="dek">
        L'Observatory consolide résultats électoraux, indicateurs socio-économiques INSEE
        et modèles prédictifs ML en une plateforme unique. Pipeline ETL automatisé · architecture
        Medallion · données vérifiables et reproductibles.
      </p>
      <div style={{ display: 'flex', gap: 10, marginTop: 28 }}>
        <a href="overview.html" className="btn primary">
          Explorer la vue d'ensemble →
        </a>
        <a href="prediction.html" className="btn secondary">Voir les modèles ML</a>
      </div>
    </section>
  );
}

function HeroVisual() {
  const sparks = {
    a: [72.0, 84.5, 80.4, 78.9, 73.6],
    b: [55.4, 60.2, 62.8, 64.0, 64.18],
  };
  const [mlStats, setMlStats] = useState({ r2: null, mae: null, cv: null, name: 'GB post-T1' });

  useEffect(() => {
    loadArtifacts().then(() => {
      const best = (MOCK.models || []).reduce((b, m) => (!b || (m.r2 ?? -Infinity) > (b.r2 ?? -Infinity)) ? m : b, null);
      if (best) {
        setMlStats({
          r2:   best.r2,
          mae:  best.mae,
          cv:   best.cv_r2 != null
            ? (best.cv_r2 * 100).toFixed(1) + (best.cv_r2_std != null ? '±' + (best.cv_r2_std * 100).toFixed(1) : '') + '%'
            : null,
          name: best.name || 'GB post-T1',
        });
      }
    });
  }, []);

  const r2Fmt  = mlStats.r2 != null ? (mlStats.r2 * 100).toFixed(1).replace('.', ',') : '—';
  const sparkMl = mlStats.r2 != null ? [60, 70, 75, 80, mlStats.r2 * 100] : [60, 70, 75, 80, 85];

  return (
    <div className="glass" style={{ padding: 28, marginBottom: 48 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
        <div>
          <div className="eyebrow">Données réelles — pipeline run 07/05/2026</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 8 }}>
            <span className="metric" style={{ fontSize: 26 }}>1 268 communes</span>
            <span style={{ color: 'var(--ink-4)', fontSize: 14 }}>· 113 colonnes · 0 nulls · QC 14/14</span>
          </div>
        </div>
        <a href="pipeline.html" className="btn ghost">Détails pipeline →</a>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
        <div style={{ padding: '18px 20px', background: 'var(--bg-2)', borderRadius: 'var(--r)', border: '1px solid var(--line)' }}>
          <div className="label">Participation IDF T1 2022</div>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginTop: 6 }}>
            <span className="metric" style={{ fontSize: 28 }}>73,6<span style={{ fontSize: 14, color: 'var(--ink-4)' }}>%</span></span>
            <span style={{ fontSize: 12, color: 'var(--ink-4)' }}>−5,3 pts vs 2017</span>
          </div>
          <Sparkline data={sparks.a} color="var(--d-1)" height={28} />
          <div style={{ fontSize: 11, color: 'var(--ink-5)', marginTop: 4 }}>Source : Ministère de l'Intérieur</div>
        </div>
        <div style={{ padding: '18px 20px', background: 'var(--bg-2)', borderRadius: 'var(--r)', border: '1px solid var(--line)' }}>
          <div className="label">Macron T2 IDF</div>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginTop: 6 }}>
            <span className="metric" style={{ fontSize: 28 }}>64,18<span style={{ fontSize: 14, color: 'var(--ink-4)' }}>%</span></span>
            <span style={{ fontSize: 12, color: 'var(--d-2)' }}>Le Pen 35,82%</span>
          </div>
          <Sparkline data={sparks.b} color="var(--d-1)" height={28} />
          <div style={{ fontSize: 11, color: 'var(--ink-5)', marginTop: 4 }}>Marge : +28,4 pts en IDF</div>
        </div>
        <div style={{ padding: '18px 20px', background: 'var(--bg-2)', borderRadius: 'var(--r)', border: '1px solid var(--line)' }}>
          <div className="label">Meilleur modèle — R²</div>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginTop: 6 }}>
            <span className="metric" style={{ fontSize: 28 }}>
              {r2Fmt}<span style={{ fontSize: 14, color: 'var(--ink-4)' }}>%</span>
            </span>
            <span style={{ fontSize: 12, color: 'var(--ink-4)' }}>{mlStats.name}</span>
          </div>
          <Sparkline data={sparkMl} color="var(--d-4)" height={28} />
          <div style={{ fontSize: 11, color: 'var(--ink-5)', marginTop: 4 }}>
            MAE : {mlStats.mae != null ? mlStats.mae.toFixed(2) + ' pp' : '—'}
            {' · '}CV R² : {mlStats.cv ?? '—'}
          </div>
        </div>
      </div>
    </div>
  );
}

function Cards() {
  const cards = [
    {
      num: '01', href: 'overview.html',
      t: "Vue d'ensemble",
      d: 'KPIs réels, classement T1/T2 IDF, courbe de participation 2002–2022, heatmap corrélations socio-électorales et résultats ML.',
    },
    {
      num: '02', href: 'comparison.html',
      t: 'Réalité vs Prédictions',
      d: 'Comparaison commune par commune entre le vainqueur réel du T2 et les prédictions des modèles ML. Matrice de confusion, accuracy par département, filtres.',
    },
    {
      num: '03', href: 'map.html',
      t: 'Carte Île-de-France',
      d: 'Carte schématique des 8 départements IDF : score Macron T2, score Le Pen, participation. Données officielles par département.',
    },
    {
      num: '04', href: 'pipeline.html',
      t: 'Pipeline ETL',
      d: 'Architecture Medallion bronze/silver/gold, 14 étapes avec durées réelles, historique des runs, logs du dernier run.',
    },
    {
      num: '05', href: 'prediction.html',
      t: 'Modèles ML',
      d: 'Comparaison RF et GB (pre-vote / post-T1), feature importance, graphiques de performance, recherche de commune par prédiction.',
    },
    {
      num: '06', href: 'projections.html',
      t: 'Projections 2025–2027',
      d: 'Scénarios prospectifs T+1/T+2/T+3 générés par le GB pré-vote sur la base des tendances socio-économiques. Courbes temporelles, heatmaps, diagrammes de probabilité.',
    },
  ];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Cinq espaces</span>
          <h2>Naviguer la plateforme</h2>
        </div>
        <p>Chaque espace répond à une question précise : explorer, comparer, surveiller, prédire.</p>
      </div>
      <div className="cards">
        {cards.map(c => (
          <a key={c.num} href={c.href} className="card">
            <div className="num">{c.num}</div>
            <h3>{c.t}</h3>
            <p>{c.d}</p>
            <div className="arrow">Ouvrir <span>→</span></div>
          </a>
        ))}
      </div>
    </section>
  );
}

function Stack() {
  const layers = [
    {
      tag: 'BRONZE', idx: '01',
      t: 'Ingestion brute',
      items: ['Élections 2012/2017/2022 T1+T2', 'INSEE RP 2022 — démographie', 'Filosofi 2017 — revenus', 'Emploi DS_RP_EMPLOI 2022'],
    },
    {
      tag: 'SILVER', idx: '02',
      t: 'Normalisation',
      items: ['silver.participation_elections', 'silver.resultats_candidats', 'silver.features_demographiques', 'silver.features_pauvrete'],
    },
    {
      tag: 'GOLD', idx: '03',
      t: 'Dataset ML',
      items: ['gold.ml_features · 1 268 × 113', 'Cibles T1 / T2 · anti-leakage', 'gold.model_predictions', 'gold.model_metrics'],
    },
  ];
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <span className="eyebrow">Architecture données</span>
          <h2>De la source brute à la prédiction</h2>
        </div>
        <p>Architecture Medallion : quality gates à chaque couche. 0 null en sortie gold.</p>
      </div>
      <div className="grid-3">
        {layers.map(l => (
          <div key={l.tag} className="panel">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
              <span className="chip" style={{ fontFamily: 'var(--mono)', fontSize: 10 }}>{l.tag}</span>
              <span style={{ color: 'var(--ink-5)', fontFamily: 'var(--mono)', fontSize: 11 }}>{l.idx}</span>
            </div>
            <h3 style={{ margin: '0 0 16px', fontSize: 18, fontWeight: 500, letterSpacing: '-0.02em' }}>{l.t}</h3>
            <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
              {l.items.map(item => (
                <li key={item} style={{ padding: '7px 0', borderBottom: '1px solid var(--line-soft)', fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
                  {item}
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <Topbar active="index" />
      <main className="shell">
        <Hero />
        <HeroVisual />
        <Cards />
        <Stack />
      </main>
      <Footer />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
