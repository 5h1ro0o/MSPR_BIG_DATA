version: "3.9"

x-env-common: &env-common
  POSTGRES_HOST:     postgres
  POSTGRES_PORT:     "5432"
  POSTGRES_DB:       elections_idf
  POSTGRES_USER:     etl_admin
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elections2022}
  DATA_ROOT:         /data
  DATA_PATH:         /data/dataset_elections_2022_idf.csv
  LOG_LEVEL:         ${LOG_LEVEL:-INFO}
  PYTHONIOENCODING:  utf-8
  PYTHONDONTWRITEBYTECODE: "1"

services:
  postgres:
    image: postgres:16-alpine
    container_name: elections_postgres
    environment:
      POSTGRES_DB:       elections_idf
      POSTGRES_USER:     etl_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elections2022}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_admin -d elections_idf"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 20s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: elections-app:latest
    container_name: elections_pipeline
    command: ["python", "-X", "utf8", "run_all.py"]
    environment:
      <<: *env-common
    volumes:
      - ${DATA_ROOT_HOST:-../}:/data
      - ./ml/artifacts:/app/ml/artifacts   # persiste modèles et CSVs de prédictions entre runs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Le pipeline est un job one-shot : il s'exécute, produit les artefacts, puis s'arrête.
    # Relancer : docker compose up --build (reconstruction image si code changé)
    #            docker compose run --rm pipeline (sans rebuild)

  nginx:
    image: nginx:1.25-alpine
    container_name: elections_nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ml/artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully  # attend la fin du pipeline (ETL + train)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/index.html || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3

volumes:
  postgres_data:
    driver: local
