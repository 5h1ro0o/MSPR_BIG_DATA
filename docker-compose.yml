version: "3.9"

x-env-common: &env-common
  POSTGRES_HOST:     postgres
  POSTGRES_PORT:     "5432"
  POSTGRES_DB:       elections_idf
  POSTGRES_USER:     etl_admin
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elections2022}
  DATA_ROOT:         /data
  DATA_PATH:         /data/dataset_elections_2022_idf.csv
  LOG_LEVEL:         ${LOG_LEVEL:-INFO}
  PYTHONIOENCODING:  utf-8
  PYTHONDONTWRITEBYTECODE: "1"

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: elections_postgres
    environment:
      POSTGRES_DB:       elections_idf
      POSTGRES_USER:     etl_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elections2022}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_admin -d elections_idf"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 20s
    restart: unless-stopped

  # ─── Pipeline ETL + ML ───────────────────────────────────────────────────────
  # Job one-shot : Fetch → ETL → Datamart → Train → Projections
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: elections-app:latest
    container_name: elections_pipeline
    command: ["python", "-X", "utf8", "run_all.py"]
    environment:
      <<: *env-common
    volumes:
      - data:/data
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Frontend React (Nginx) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: elections_nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ml/artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/index.html || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ─── Grafana BI ───────────────────────────────────────────────────────────────
  # Tableau de bord analytique — alternative BI au frontend React
  # Accès : http://localhost:3001  (admin / elections2022)
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: elections_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-elections2022}
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL:         http://localhost:3001
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/elections_idf.json
      GF_FEATURE_TOGGLES_ENABLE:  publicDashboards
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_LEVEL:               warn
      GF_LOG_MODE:                console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local
  data:
    driver: local
